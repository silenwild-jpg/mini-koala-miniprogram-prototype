# GIT-MERGE-02N: publish only the sanitized RC1 static review runtime.
# Netlify site-level SSO/team-login restriction MUST cover all deploy contexts.
# This config does not provide access control by itself.
[build]
  command = "python3 scripts/build_rc1_private_site.py"
  publish = "release-evidence/merge02n/site"

[build.environment]
  PYTHON_VERSION = "3.13"
