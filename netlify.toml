# RC2-UAT-CD-01: dedicated branch + dedicated SSO-protected Netlify site ONLY.
# This file exists on uat/rc2-pr96-20261110; it does NOT modify main or PR #96.
# Linking the repository in Netlify is a one-time owner action: there is no deploy API exposed in Chat.
# THIS IS NOT PUBLIC ACCESS CONTROL: retain Netlify Team SSO in site settings.
#
# Git repository: silenwild-jpg/mini-koala-miniprogram-prototype
# Production branch for this UAT-only site: uat/rc2-pr96-20261110
# Netlify site ID: bc2df934-a53b-4b99-b751-810b8781577f
# Script-QA validated PR runtime (human final visual signoff pending): e435bb25eddc8a8ad4c84427ca9883d4ec3e9c16
# Pinned app/ Git tree: 4fbf5eefccbc9ee3e05a969b88334314263a3e79

[build]
  # Guard blocks altered runtime, wrong Netlify site, or wrong deploy branch.
  # Preserve the historical VIS-11J / S01 master verification when Git clones are shallow.
  command = "python3 scripts/verify_rc2_netlify_uat_01.py && (git cat-file -e 4dc9f5f76277639463d9d0d2ffed2c4e7f49e969^{commit} || git fetch --quiet --no-tags origin 4dc9f5f76277639463d9d0d2ffed2c4e7f49e969) && python3 scripts/build_rc2_isolated_demo.py && python3 scripts/verify_rc2_uat_access_01_package.py"
  publish = "release-evidence/rc2-merge-prep-10/site"

[build.environment]
  PYTHON_VERSION = "3.13"
  NODE_VERSION = "22"
  RC2_BUNDLE_LABEL = "RC2-UAT-PR96-P1-CANDIDATE-02"
  RC2_BUNDLE_BRANCH = "uat/rc2-pr96-20261110"
  RC2_BUNDLE_ARCHIVE = "MiniKoala_RC2_UAT_PR96_P1.zip"
  RC2_APPROVED_CANDIDATE_SHA = "e435bb25eddc8a8ad4c84427ca9883d4ec3e9c16"
  RC2_APPROVED_APP_TREE = "4fbf5eefccbc9ee3e05a969b88334314263a3e79"
  RC2_UAT_NETLIFY_SITE_ID = "bc2df934-a53b-4b99-b751-810b8781577f"

# The site is an internal review environment; crawl-control headers do not replace Team SSO.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/rc2-uat-version.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
