name: H01 05 identity and lock demo entry 375-390 (NO DEPLOY)
on:
  push:
    branches: [feat/h01-identity-lock-gate-05-20261111]
    paths: [.github/workflows/h01-identity-lock-05.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h01-identity-lock-05
  cancel-in-progress: true
jobs:
  h01-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact source and frozen orders
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          node --check scripts/verify_h01_identity_lock_05_browser.cjs
          node --check app/prototype/parallel/core-journey-fix-01/demo/h01-state-impl-01.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/h01-state-policy-01.js
          node qa/test_h01_postpay_access_deposit_01.cjs
          node qa/test_h01_order_payment_3h.cjs
          node qa/test_h01_state_implement_01.cjs
      - name: Build H01-only prototype pinned to PR 114
        env:
          RC2_BUNDLE_BRANCH: feat/h01-identity-lock-gate-05-20261111
          RC2_BUNDLE_SOURCE_PR: "114"
          RC2_BUNDLE_LABEL: H01-STATE-VIS-RESTORE-05-INDEPENDENT
          RC2_BUNDLE_ARCHIVE: H01_IDENTITY_LOCK_05_LOCAL_REVIEW.zip
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Install Chromium and Chinese fonts
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Verify identity and demo-only lock entry with lifecycle states
        env:
          RC2_EXPECT_SHA: ${{ github.sha }}
        run: node scripts/verify_h01_identity_lock_05_browser.cjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PR114_H01_IDENTITY_LOCK_DEMO_ONLY_EVIDENCE
          path: |
            release-evidence/h01-identity-lock-05/
            release-evidence/rc2-merge-prep-10/site/rc2-uat-version.json
          retention-days: 7
          if-no-files-found: warn

# Latest scope: one-tap lock UI only. No BLE implementation or device ACK testing.
