name: RC2-MERGE-PREP-04 business QA + source/visual HOLD
on:
  push:
    branches:
      - isolate/rc2-merge-prep-04-without-hifi06-20261102
  pull_request:
    branches:
      - isolate/rc2-merge-prep-02-s01-fourfilters-h01-gate-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: S01 four-filter source and lifecycle contract
        run: |
          node --check app/prototype/parallel/core-journey-fix-01/demo/app.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/s01-r2-bind.js
          node --check scripts/verify_rc2_merge_prep_02_browser.cjs
          node scripts/verify_rc2_merge_prep_02.cjs
          node scripts/verify_rc2_rule_fix_01b.cjs
          node scripts/verify_rc2_rule_fix_01c.cjs
  isolated-browser:
    runs-on: ubuntu-latest
    needs: isolated-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Four-filter S01 375/390 and O01 O03
        run: node scripts/verify_rc2_merge_prep_02_browser.cjs
      - name: Aftercare and payment anomalies 375/390
        run: |
          node scripts/verify_rc2_rule_fix_01c_browser.cjs
          node scripts/verify_rc2_rule_fix_01d_browser.cjs
      - name: Upload private evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-merge-prep-02-s01-and-aftercare
          path: |
            release-evidence/rc2-merge-prep-02/
            release-evidence/rc2-fix-01c/
            release-evidence/rc2-fix-01d/
          if-no-files-found: warn
  release-gate-hold:
    runs-on: ubuntu-latest
    needs: isolated-browser
    steps:
      - uses: actions/checkout@v4
      - name: Assert RC2 premerge gate remains HOLD for actual unready pages
        run: |
          set +e
          node scripts/verify_rc2_merge_prep_02_release_gate.cjs
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then echo "Expected controlled HOLD (exit 2), got $code"; exit 1; fi
          node -e "const r=require('./release-evidence/rc2-merge-prep-04/release-gate.json');if(r.status!=='HOLD'||r.hifi06!=='ABANDONED_NOT_A_REQUIRED_SOURCE'||!r.blockers.some(x=>x.includes('CAP_HTML_NOT_IMPLEMENTED'))||!r.blockers.some(x=>x.includes('ITEMS_HTML_NOT_IMPLEMENTED')))process.exit(1);console.log('Controlled premerge HOLD verified: CAP/ITEMS source empty; HIFI06 not required')"

      - name: Retain HOLD report for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-merge-prep-04-release-hold
          path: release-evidence/rc2-merge-prep-04/release-gate.json
          if-no-files-found: warn
