name: S5-UX-REVIEW-03 fourteen real-browser state screenshots NO DEPLOY
on:
  push:
    branches:
      - isolate/s5-ux-review-03-20261103
  pull_request:
    branches:
      - isolate/s5-ux-review-02-20261103
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s5-real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Source rules and strict thresholds
        run: |
          node --check scripts/verify_s5_ux_review_03_browser.cjs
          node --check app/prototype/parallel/core-journey-fix-01/demo/br04/bridge.js
          node scripts/verify_s5_ux_review_02.cjs
      - name: Install real Chromium and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build isolated source with frozen-master guard
        env:
          RC2_BUNDLE_LABEL: S5-UX-REVIEW-03
          RC2_BUNDLE_ARCHIVE: MiniKoala_S5_UX_REVIEW_03_20261103.zip
          RC2_BUNDLE_BRANCH: isolate/s5-ux-review-03-20261103
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: 14 real Chromium controlled-state tests and screenshots
        run: node scripts/verify_s5_ux_review_03_browser.cjs
      - name: 32 live main-page views across both widths
        run: node scripts/verify_rc2_vis_integration_02_browser.cjs
      - name: Real end-to-end S5 and order flow
        run: node scripts/verify_proto_rule_restore_06_browser.cjs
      - name: Upload private visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s5-ux-review-03-private-screens
          path: |
            release-evidence/s5-ux-review-03/
            release-evidence/rc2-vis-integration-02/
            release-evidence/rule-restore-06/
            release-evidence/rc2-merge-prep-10/build-summary.json
          retention-days: 14
          if-no-files-found: warn
