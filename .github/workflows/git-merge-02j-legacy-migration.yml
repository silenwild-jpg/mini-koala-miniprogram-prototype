name: GIT-MERGE-02J original MK stores and size-options migration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-legacy-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all original source entities and canonical MK quote
        working-directory: app/prototype/parallel/core-journey-fix-01
        run: |
          set -e
          node --check demo/fixtures.js
          node --check demo/central-contract.js
          node --check qa/test_merge02j_legacy.cjs
          node --check qa/test_merge02j_browser.cjs
          MK_CATALOG_MODE=MK node qa/test_merge02j_legacy.cjs
      - name: Verify existing SIM demo regression still works
        working-directory: app/prototype/parallel/core-journey-fix-01
        run: |
          set -e
          node demo/qa/test_model.js
          node demo/qa/test_decisions.js
          node demo/qa/test_mainchain_decision.js
          node demo/qa/test_merge02c_policy.js
          node qa/test_merge02g_contract.js
          node qa/test_merge02i_policy.js
      - name: Install Chromium with CJK fonts
        working-directory: app/prototype/parallel/core-journey-fix-01
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Original MK store selection and real O01 demo 375/390
        working-directory: app
        run: |
          python3 -m http.server 4270 --bind 127.0.0.1 >/tmp/merge02j-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 3
          node prototype/parallel/core-journey-fix-01/qa/test_merge02j_browser.cjs
      - name: Upload internal evidence regardless of failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge02j-MK-126stores-766options-private
          path: app/prototype/parallel/core-journey-fix-01/evidence/merge02j/
          if-no-files-found: warn
          retention-days: 7
