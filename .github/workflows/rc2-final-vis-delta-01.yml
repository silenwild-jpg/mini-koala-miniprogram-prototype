name: RC2-FINAL-VIS-DELTA-01 H01 S01 text 375 390 NO DEPLOY
on:
  push:
    branches: [isolate/rc2-final-vis-delta-01-20261104]
  pull_request:
    branches: [isolate/rc2-single-candidate-01-20261104]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-data-and-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect syntax and source contracts
        run: |
          node --check app/prototype/parallel/core-journey-fix-01/demo/app.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/br04/bridge.js
          node --check scripts/verify_s5_ux_close_01_browser.cjs
          node scripts/verify_s5_ux_review_02.cjs
          node scripts/verify_rc2_final_integration_01_contract.cjs
          node scripts/verify_rc2_single_candidate_01_source.cjs
      - name: Install Chromium and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build isolated RC2 with approved master SHA and retired visual guards
        env:
          RC2_BUNDLE_LABEL: RC2-FINAL-VIS-DELTA-01-ISOLATED
          RC2_BUNDLE_ARCHIVE: MiniKoala_RC2_FINAL_VIS_DELTA_01.zip
          RC2_BUNDLE_BRANCH: isolate/rc2-final-vis-delta-01-20261104
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Real source directory across city capacity and term permutations
        run: node scripts/verify_s5_ux_close_01_browser.cjs
      - name: Verify fixed third E-storage, compact fourth-plus store rows and actual routes in both sizes
        run: node scripts/verify_rc2_s01_recommend_03_browser.cjs
      - name: Manual city and district selection and demo stock in both sizes
        run: node scripts/verify_rc2_s5_final_01_browser.cjs
      - name: Seven controlled states 375 and 390
        run: node scripts/verify_s5_ux_review_03_browser.cjs
      - name: Full RC2 pages and core navigation
        run: |
          node scripts/verify_rc2_vis_integration_02_browser.cjs
          node scripts/verify_proto_rule_restore_06_browser.cjs
      - name: Visible H01 and S01 copy corrections, 375/390 real interactive browser screenshots
        run: node scripts/verify_rc2_final_vis_delta_01_browser.cjs
      - name: H01 approved PR77 native visual and five-city states
        run: node scripts/verify_h01_ux_review_03a_browser.cjs
      - name: S01 PR81 native layout and nine-state source, 375/390
        run: node scripts/verify_s01_vis_restore_01_browser.cjs
      - name: S02 PR64 central three-tab map and six-state 375/390
        run: node scripts/verify_s02_central_integration_01_browser.cjs
      - name: Collect private evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-final-vis-delta-01-private-evidence
          path: |
            release-evidence/rc2-final-vis-delta-01/
            release-evidence/h01-ux-review-03a/
            release-evidence/s01-vis-restore-01/
            release-evidence/s02-central-integration-01/
            release-evidence/rc2-s01-recommend-03/
            release-evidence/s5-ux-close-01/
            release-evidence/rc2-s5-final-01/
            release-evidence/s5-ux-review-03/
            release-evidence/rc2-vis-integration-02/
            release-evidence/rule-restore-06/
            release-evidence/rc2-merge-prep-10/build-summary.json
          retention-days: 14
          if-no-files-found: warn
