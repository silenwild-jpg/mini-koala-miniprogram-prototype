name: RC2 H01 M01 isolated integrated 375 390 NO DEPLOY
on:
  push:
    branches: [isolate/rc2-h01-m01-integration-01-20261112]
    paths: [.github/workflows/rc2-h01-m01-integration-01.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc2-h01-m01-integration-01
  cancel-in-progress: true
jobs:
  same-sha:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: RC2 visual/source guard and non-regression Node
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code f53e5fd896444de268b92dd20ac77a91b71b5444 HEAD -- app/prototype/parallel/core-journey-fix-01/demo/home.html app/prototype/parallel/core-journey-fix-01/demo/home-bridge.js app/prototype/parallel/core-journey-fix-01/demo/h01-state-impl-01.js app/prototype/parallel/core-journey-fix-01/demo/h01-state-impl-01.css app/prototype/parallel/core-journey-fix-01/demo/br04/s5/ app/prototype/parallel/core-journey-fix-01/demo/s01-r2-bind.js app/prototype/parallel/core-journey-fix-01/demo/s02-central.css app/prototype/parallel/core-journey-fix-01/demo/global-store-tags.css app/prototype/parallel/core-journey-fix-01/demo/fixtures.js
          grep -q 'const rentTotal=deposit\*months;' app/prototype/parallel/core-journey-fix-01/demo/demo-core.js
          grep -q 'const requirementReady=' app/prototype/parallel/core-journey-fix-01/demo/demo-core.js
          if grep -q 'KOALA-LOCAL' app/prototype/parallel/core-journey-fix-01/demo/account.js; then exit 1; fi
          for f in app/prototype/parallel/core-journey-fix-01/demo/{app,demo-core,h01-state-policy-01,lifecycle-ui,m01-rebaseline-01,m01-order-route-01}.js app/prototype/parallel/core-journey-fix-01/demo/br04/bridge.js scripts/verify_{rc2_h01_m01_integration_01_browser,h01_m01_flow_qa_01,h01_m01_business_date_01,m01_ia_03}.cjs; do node --check "$f"; done
          node scripts/verify_rc2_business_rebuild_01.cjs
          node scripts/verify_vis_system_04b1_tag_semantics.cjs
          node qa/test_h01_order_payment_3h.cjs
          node qa/test_h01_state_implement_01.cjs
          node qa/test_h01_postpay_access_deposit_01.cjs
          node scripts/verify_m01_ia_03.cjs
          node scripts/verify_h01_m01_flow_qa_01.cjs
          node scripts/verify_h01_m01_business_date_01.cjs
      - name: Chinese glyph and Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROME_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          fi
          if ! fc-list :lang=zh 2>/dev/null | grep -q .; then sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk; fi
          npm_config_fetch_retries=1 npm_config_fetch_timeout=45000 npm install --no-save --no-package-lock --prefer-offline playwright@1.56.1
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1; then npx playwright install chromium; fi
      - name: RC2 H01 new-user marketing S01 S02 S5 M01 same SHA 375 390 smoke
        run: node scripts/verify_rc2_h01_m01_integration_01_browser.cjs
      - name: Integrated H01 M01 multi order and aftersales 375 390
        run: node scripts/verify_h01_m01_flow_qa_01_browser.cjs
      - name: Integrated M01 all rental assets 375 390
        run: node scripts/verify_m01_ia_03_browser.cjs
      - name: Integrated 3 hour payment and deposit 375 390
        run: node scripts/verify_h01_m01_contract_01_browser.cjs
      - name: Upload same SHA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC2-H01-M01-INTEGRATION-01-375-390
          retention-days: 7
          if-no-files-found: warn
          path: |
            release-evidence/rc2-h01-m01-integration-01/
            release-evidence/h01-m01-flow-qa-01/
            release-evidence/m01-ia-03/
            release-evidence/h01-m01-contract-01/
