name: S01 UX REFINE 05 A B isolate NO DEPLOY
on:
  push:
    branches:
      - explore/s01-ux-refine-05-20261111
    paths:
      - .github/workflows/s01-ux-refine-05.yml
      - app/prototype/parallel/core-journey-fix-01/demo/s01-r2-bind.js
      - app/prototype/parallel/core-journey-fix-01/demo/s01-ux-refine-05.css
      - scripts/verify_s01_ux_refine_05_browser.cjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s01-ux-refine-05-experiment
  cancel-in-progress: true
jobs:
  verify-visual-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Source syntax + business contract check
        run: |
          node --check app/prototype/parallel/core-journey-fix-01/demo/s01-r2-bind.js
          node --check scripts/verify_s01_ux_refine_05_browser.cjs
          node scripts/verify_rc2_business_rebuild_01.cjs
      - name: Build isolated visual comparison candidate (not deployed)
        env:
          RC2_BUNDLE_BRANCH: explore/s01-ux-refine-05-20261111
          RC2_BUNDLE_LABEL: S01-UX-REFINE-05-AB-ISOLATED
          RC2_BUNDLE_ARCHIVE: MiniKoala_S01_UX_REFINE_05_NO_DEPLOY.zip
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Install Chromium + CJK fonts
        run: |
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: A/B native 375/390 demand and price layout with term extremes
        run: node scripts/verify_s01_ux_refine_05_browser.cjs
      - name: Existing baseline S01 contract remains unchanged without A/B URL
        run: |
          node scripts/verify_s01_state_price_03_browser.cjs
          node scripts/verify_s01_vis_refine_04_browser.cjs
      - name: Save screenshot and numerical comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-ux-refine-05-ab-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            release-evidence/s01-ux-refine-05/
            release-evidence/s01-state-price-03/
            release-evidence/s01-vis-refine-04/
            release-evidence/rc2-merge-prep-10/build-summary.json
