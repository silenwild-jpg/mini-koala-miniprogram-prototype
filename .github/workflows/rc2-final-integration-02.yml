name: RC2 FINAL INTEGRATION 02
on:
  pull_request:
    branches:
      - isolate/h01-ux-review-03a-headline-375390-20261104
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified-app-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify source commit is the requested PR head
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax and five-city store contracts
        run: |
          node --check app/prototype/parallel/core-journey-fix-01/demo/app.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/br04/bridge.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/s01-r2-bind.js
          node --check scripts/verify_rc2_final_integration_02_browser.cjs
          node scripts/verify_h01_ux_review_02.cjs
      - name: Build traceable RC2 preview files
        run: |
          python3 scripts/build_rc2_final_admission_01.py
          mkdir -p release-evidence/rc2-merge-prep-10/site
          cp -a release-evidence/rc2-final-admission-01/site/. release-evidence/rc2-merge-prep-10/site/
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: H01/S01/S02/S5 single HEAD 375 and 390 actual browser
        run: node scripts/verify_rc2_final_integration_02_browser.cjs
      - name: H01 current visual and state regression
        run: node scripts/verify_h01_ux_review_03a_browser.cjs
      - name: S01 latest fixed E-store and nine state regression
        run: |
          node scripts/verify_s01_ux_review_02_browser.cjs
          node scripts/verify_s01_ux_review_03_nine_states_browser.cjs
      - name: RC2 full customer lifecycle regression
        run: node scripts/verify_rc2_rule_fix_01d_browser.cjs
      - name: Upload traceable RC2 review ZIP (not deployed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC2-FINAL-INTEGRATION-02-private-review-ZIP
          path: |
            release-evidence/rc2-final-admission-01/MiniKoala_RC2_FINAL_ADMISSION_01_PRIVATE_REVIEW.zip
            release-evidence/rc2-final-admission-01/manifest.json
            release-evidence/rc2-final-admission-01/build-summary.json
            release-evidence/rc2-final-admission-01/SHA256SUMS.txt
          if-no-files-found: warn
      - name: Upload all actual screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC2-FINAL-INTEGRATION-02-375-390
          path: |
            release-evidence/rc2-final-integration-02/screens/
            release-evidence/h01-ux-review-03a/
            release-evidence/s01-ux-review-02/
            release-evidence/s01-ux-review-03/
            release-evidence/rc2-rule-fix-01d/
          if-no-files-found: warn

  fullsite-375-390-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify source commit is the requested PR head
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check scripts/verify_rc2_final_integration_02_fullsite_browser.cjs
      - name: Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Nine actual routes at 375 and 390, three viewport positions
        run: node scripts/verify_rc2_final_integration_02_fullsite_browser.cjs
      - name: Upload 54 whole-site smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC2-FINAL-INTEGRATION-02-fullsite-screens
          path: release-evidence/rc2-final-integration-02/fullsite/
          if-no-files-found: warn
