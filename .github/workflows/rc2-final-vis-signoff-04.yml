name: RC2 FINAL VIS SIGNOFF 04 renewal payment and identity 375/390 NO DEPLOY
on:
  push:
    branches: [isolate/rc2-final-vis-signoff-04-20261112]
    paths: [.github/workflows/rc2-final-vis-signoff-04.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc2-final-vis-signoff-04-only
  cancel-in-progress: true
jobs:
  proto-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Frozen source scope and renewal identity non-regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --name-only 501d05b31b15c6e100a5ff442a34bba1c9c714c1 HEAD -- app/ > /tmp/rc2-vis04-scope
          cat /tmp/rc2-vis04-scope
          while IFS= read -r file; do
            case "$file" in
              app/prototype/parallel/core-journey-fix-01/demo/app.js|app/prototype/parallel/core-journey-fix-01/demo/account.js|app/prototype/parallel/core-journey-fix-01/demo/demo-core.js|app/prototype/parallel/core-journey-fix-01/demo/lifecycle-ui.js|app/prototype/parallel/core-journey-fix-01/demo/m01-lifecycle-shell-02.css|app/prototype/parallel/core-journey-fix-01/demo/m01-service-shell-02.css) ;;
              *) echo "VIS-GUARD_SCOPE_VIOLATION: $file"; exit 1 ;;
            esac
          done < /tmp/rc2-vis04-scope
          for f in app/prototype/parallel/core-journey-fix-01/demo/{app,account,demo-core,lifecycle-ui}.js scripts/verify_rc2_final_vis_signoff_04_contract.cjs scripts/verify_rc2_final_vis_signoff_04_browser.cjs scripts/verify_rc2_final_vis_signoff_03_browser.cjs; do node --check "$f"; done
          node scripts/verify_rc2_final_vis_signoff_04_contract.cjs
          node scripts/verify_rc2_business_rebuild_01.cjs
          node scripts/verify_rc2_vis_signoff_02_geometry.cjs
          node scripts/verify_vis_system_04b1_tag_semantics.cjs
          node qa/test_h01_order_payment_3h.cjs
          node qa/test_h01_postpay_access_deposit_01.cjs
          node scripts/verify_h01_m01_flow_qa_01.cjs
          node scripts/verify_h01_m01_business_date_01.cjs
          node scripts/verify_m01_ia_03.cjs
      - name: Install Chromium and Chinese glyphs
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROME_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          fi
          if ! fc-list :lang=zh 2>/dev/null | grep -q .; then sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk; fi
          npm_config_fetch_retries=1 npm_config_fetch_timeout=45000 npm install --no-save --no-package-lock --prefer-offline playwright@1.56.1
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1; then npx playwright install chromium; fi
      - name: New renewal payment and isolated identity customer/reviewer 375 390
        run: node scripts/verify_rc2_final_vis_signoff_04_browser.cjs
      - name: Preserve VIS03 375 390 aftersales and exceptional state screenshots
        run: node scripts/verify_rc2_final_vis_signoff_03_browser.cjs
      - name: Preserve H01 M01 order isolation and history 375 390
        run: node scripts/verify_h01_m01_flow_qa_01_browser.cjs
      - name: Preserve M01 asset and two-warehouse 375 390
        run: node scripts/verify_m01_ia_03_browser.cjs
      - name: Preserve 3 hour checkout and refund 375 390
        run: node scripts/verify_h01_m01_contract_01_browser.cjs
      - name: Preserve RC2 H01 S01 S02 S5 M01 common layout 375 390
        run: node scripts/verify_rc2_h01_m01_integration_01_browser.cjs
      - name: Upload exact SHA screenshots JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC2-FINAL-VIS-SIGNOFF-04-375-390
          retention-days: 7
          if-no-files-found: warn
          path: |
            release-evidence/rc2-final-vis-signoff-04/
            release-evidence/rc2-final-vis-signoff-03/
            release-evidence/h01-m01-flow-qa-01/
            release-evidence/m01-ia-03/
            release-evidence/h01-m01-contract-01/
            release-evidence/rc2-h01-m01-integration-01/
