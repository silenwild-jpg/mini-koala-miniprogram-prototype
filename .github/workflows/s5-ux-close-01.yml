name: S5-UX-CLOSE-01 actual catalog + frozen visual gate NO DEPLOY
on:
  push:
    branches: [isolate/s5-ux-close-01-20261103]
  pull_request:
    branches: [isolate/s5-ux-review-03-20261103]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-data-and-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect syntax and source contracts
        run: |
          node --check app/prototype/parallel/core-journey-fix-01/demo/app.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/br04/bridge.js
          node --check scripts/verify_s5_ux_close_01_browser.cjs
          node scripts/verify_s5_ux_review_02.cjs
      - name: Install Chromium and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build isolated RC2 with approved master SHA and retired visual guards
        env:
          RC2_BUNDLE_LABEL: S5-UX-CLOSE-01-ISOLATED
          RC2_BUNDLE_ARCHIVE: MiniKoala_S5_UX_CLOSE_01.zip
          RC2_BUNDLE_BRANCH: isolate/s5-ux-close-01-20261103
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Real source directory across city capacity and term permutations
        run: node scripts/verify_s5_ux_close_01_browser.cjs
      - name: Seven controlled states 375 and 390
        run: node scripts/verify_s5_ux_review_03_browser.cjs
      - name: Full RC2 pages and core navigation
        run: |
          node scripts/verify_rc2_vis_integration_02_browser.cjs
          node scripts/verify_proto_rule_restore_06_browser.cjs
      - name: Collect private evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s5-ux-close-01-private-evidence
          path: |
            release-evidence/s5-ux-close-01/
            release-evidence/s5-ux-review-03/
            release-evidence/rc2-vis-integration-02/
            release-evidence/rule-restore-06/
            release-evidence/rc2-merge-prep-10/build-summary.json
          retention-days: 14
          if-no-files-found: warn
