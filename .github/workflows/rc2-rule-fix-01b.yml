name: RC2-RULE-FIX-01D isolated full-journey QA
on:
  pull_request:
    types: [ready_for_review]
    paths:
      - 'app/prototype/parallel/core-journey-fix-01/demo/**'
      - 'scripts/verify_rc2_rule_fix_01b.cjs'
      - 'scripts/verify_rc2_rule_fix_01c.cjs'
      - 'scripts/verify_rc2_rule_fix_01c_browser.cjs'
      - 'scripts/verify_rc2_rule_fix_01d_browser.cjs'
      - '.github/workflows/rc2-rule-fix-01b.yml'
  workflow_dispatch:
concurrency:
  group: rc2-rule-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and model tests
        run: |
          node --check app/prototype/parallel/core-journey-fix-01/demo/app.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/demo-core.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/br04/bridge.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/lifecycle-contract.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/lifecycle-ui.js
          node --check scripts/verify_rc2_rule_fix_01c_browser.cjs
          node --check scripts/verify_rc2_rule_fix_01d_browser.cjs
          node scripts/verify_rc2_rule_fix_01b.cjs
          node scripts/verify_rc2_rule_fix_01c.cjs
  browser:
    # Full browser coverage is included in the RC2 candidate gate.
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real 375/390 browser lifecycle QA
        run: node scripts/verify_rc2_rule_fix_01c_browser.cjs
      - name: Real 375/390 browser S01-S02-O01-S5 aftercare and payment variants
        run: node scripts/verify_rc2_rule_fix_01d_browser.cjs
      - name: Upload private screenshots and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-rule-fix-01d-full-journey-evidence
          path: |
            release-evidence/rc2-fix-01c/
            release-evidence/rc2-fix-01d/
          if-no-files-found: warn
          retention-days: 7
