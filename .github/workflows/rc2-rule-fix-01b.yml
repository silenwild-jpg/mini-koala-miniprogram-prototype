name: RC2-RULE-FIX-01B isolated lifecycle smoke
on:
  pull_request:
    paths:
      - 'app/prototype/parallel/core-journey-fix-01/demo/**'
      - 'scripts/verify_rc2_rule_fix_01b.cjs'
      - '.github/workflows/rc2-rule-fix-01b.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/prototype/parallel/core-journey-fix-01/demo/app.js
      - run: node --check app/prototype/parallel/core-journey-fix-01/demo/lifecycle-contract.js
      - run: node scripts/verify_rc2_rule_fix_01b.cjs
