name: RC2-P1-DEMO-CLOSE-01 isolated 375-390 regression NO DEPLOY
on:
  push:
    branches:
      - fix/rc2-p1-demo-close-01-20261110
    paths:
      - .github/workflows/rc2-p1-demo-close-01.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc2-p1-demo-close-01
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify P1 diff and immutable reference business source
        run: |
          set -eux
          test "$(git rev-parse a6b5e7c70b7b44b699369218c2b2ee67401d5c81:app)" = 6f96d6dc95c0669aa571e260ff18d0ca097cc3cf
          node --check scripts/verify_rc2_p1_demo_close_01_browser.cjs
          node scripts/verify_rc2_business_rebuild_01.cjs
          node scripts/verify_rc2_merge_prep_10_order_contract.cjs
          node scripts/verify_rc2_final_integration_01_contract.cjs
      - name: Build exact isolated candidate only
        env:
          RC2_BUNDLE_BRANCH: fix/rc2-p1-demo-close-01-20261110
          RC2_BUNDLE_LABEL: RC2-P1-DEMO-CLOSE-01-ISOLATED-CANDIDATE
          RC2_BUNDLE_ARCHIVE: MiniKoala_RC2_P1_DEMO_CLOSE_01.zip
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Install isolated Chromium and CJK fonts
        run: |
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: New P1 browser and visual tests on 375/390
        run: node scripts/verify_rc2_p1_demo_close_01_browser.cjs
      - name: O01 real payment UI and truthful result checks 375 390
        run: node scripts/verify_rc2_p1_demo_close_02_order_ui.cjs
      - name: Prior scripted tasks and S01 S02 price contract regression
        run: |
          node scripts/verify_rc2_visual_uat_01_tasks.cjs
          node scripts/verify_rc2_visual_decision_01_browser.cjs
          node scripts/verify_ux_audit_gate_03_browser.cjs
      - name: Upload inspectable P1 screenshot/geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-p1-demo-close-01-browser-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            release-evidence/rc2-p1-demo-close-01/
            release-evidence/rc2-visual-uat-01/results.json
            release-evidence/rc2-visual-decision-01/results.json
            release-evidence/ux-audit-gate-03/results.json
            release-evidence/rc2-merge-prep-10/build-summary.json

# R2: Order page must be mounted with validated context; use real cold-order guard plus copy contract.
