name: NAV VIS UNIFY 01E - isolated optical candidates and H01 readability trials
on:
  push:
    branches: [isolate/nav-vis-unify-01e-20261112]
    paths:
      - .github/workflows/nav-vis-unify-01e.yml
      - scripts/verify_nav_vis_unify_01e_browser.cjs
      - scripts/verify_nav_vis_unify_01e_current_browser.cjs
      - scripts/verify_nav_vis_unify_01e_pixel.py
      - docs/NAV_VIS_UNIFY_01E_20261112.md
      - app/assets/nav/nav01e-candidates/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nav-vis-unify-01e-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  source-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Lock prior PR159 and allow only two new SVG candidates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'isolate/nav-vis-unify-01e-20261112'
          test -z "$(git diff --name-only 5eaafd6358184fb671339123e060c11cdce162f3 HEAD -- app/prototype/)" || { echo RUNTIME_MUTATION_FORBIDDEN; exit 1; }
          git diff --name-only 5eaafd6358184fb671339123e060c11cdce162f3 HEAD -- app/ | sort > /tmp/nav01e-actual
          printf '%s\n' app/assets/nav/nav01e-candidates/mine-active.svg app/assets/nav/nav01e-candidates/stores-active.svg | sort > /tmp/nav01e-expected
          diff -u /tmp/nav01e-expected /tmp/nav01e-actual
          d=app/prototype/parallel/core-journey-fix-01/demo
          grep -Fq 'nav-current-01c/' "$d/app.js"
          grep -Fq 'footer-nav::after{content:"预约订单"' "$d/home.html"
          test "$(git hash-object "$d/h01-state-impl-01.js")" = ed1a5369aaa4dbc415aa62390107c91a732d2fe2
          test "$(git hash-object "$d/h01-state-impl-01.css")" = 713c418185549bd888e02d918e0723c2c12247d8
          for f in app/assets/nav/nav01e-candidates/*.svg; do
            grep -Fq 'viewBox="0 0 24 24"' "$f"
            grep -Fq '<title>' "$f"
          done
          node --check scripts/verify_nav_vis_unify_01e_browser.cjs
          node --check scripts/verify_nav_vis_unify_01e_current_browser.cjs
      - name: Preserve core order and H01 frozen business contracts
        run: |
          node qa/test_h01_order_payment_3h.cjs
          node qa/test_h01_state_implement_01.cjs
          node scripts/verify_rc2_business_rebuild_01.cjs
  two-width-browser:
    needs: source-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Build exact same SHA isolated HTML prototype
        env:
          RC2_BUNDLE_BRANCH: ${{ github.ref_name }}
          RC2_BUNDLE_SOURCE_PR: '159'
          RC2_BUNDLE_BASE_PR: '159'
          RC2_BUNDLE_LABEL: NAV-VIS-UNIFY-01E-ISOLATED-OPTICS
          RC2_BUNDLE_ARCHIVE: MiniKoala_NAV_VIS_UNIFY_01E.zip
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Validate source commit and parent PR
        run: |
          node -e "const m=require('./release-evidence/rc2-merge-prep-10/site/rc2-uat-version.json');if(m.source_sha!==process.env.GITHUB_SHA||m.source_branch!==process.env.GITHUB_REF_NAME||m.source_pr!==159)throw Error('NAV01E_SHA_MISMATCH');console.log(m)"
      - name: Install browser and Chinese font support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          test -n "$(fc-list :lang=zh family | head -1)"
      - name: Compare H01 muted/strong contrast and S01/M01 optical icon candidates
        run: node scripts/verify_nav_vis_unify_01e_browser.cjs
      - name: Confirm current 01C runtime navigation and two-view route behavior remain unchanged
        run: node scripts/verify_nav_vis_unify_01e_current_browser.cjs
      - name: Third caption only pixel-difference guard
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/verify_nav_vis_unify_01e_pixel.py
      - name: H01 twenty-state visual anti-regression across two viewports
        env:
          RC2_EXPECT_SHA: ${{ github.sha }}
          RC2_EXPECT_BRANCH: ${{ github.ref_name }}
          RC2_EXPECT_SOURCE_PR: '159'
          H01_BROWSER_CHANNEL: chromium
        run: node scripts/verify_rc2_single_candidate_03_h01_browser.cjs
      - name: Keep artifact in audit only no deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NAV-VIS-UNIFY-01E-CANDIDATES-375-390
          retention-days: 7
          if-no-files-found: warn
          path: |
            app/assets/nav/nav01e-candidates/
            release-evidence/nav-vis-unify-01e/
            release-evidence/nav-vis-unify-01e-current/
            release-evidence/rc2-single-candidate-03-h01/
            release-evidence/rc2-merge-prep-10/site/rc2-uat-version.json
