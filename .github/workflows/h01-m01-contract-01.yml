name: H01 M01 shared contract same SHA Chromium 375 390 NO DEPLOY
on:
  push:
    branches: [isolate/h01-m01-contract-01-20261112]
    paths: [.github/workflows/h01-m01-contract-01.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h01-m01-contract-01-only
  cancel-in-progress: true
jobs:
  isolated-contract-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Protect H01 core, S5 master and run node contract tests
        shell: bash
        run: |
          set -eu
          git rev-parse HEAD
          git diff --name-only f08bafb95dcc826aecb0053dfbdefb4f047580c7 HEAD -- app/ > /tmp/h01m01_appscope.txt
          cat /tmp/h01m01_appscope.txt
          while IFS= read -r f; do
            case "$f" in
              app/prototype/parallel/core-journey-fix-01/demo/app.js|app/prototype/parallel/core-journey-fix-01/demo/index.html|app/prototype/parallel/core-journey-fix-01/demo/account.js|app/prototype/parallel/core-journey-fix-01/demo/account.html|app/prototype/parallel/core-journey-fix-01/demo/h01-state-policy-01.js|app/prototype/parallel/core-journey-fix-01/demo/lifecycle-ui.js|app/prototype/parallel/core-journey-fix-01/demo/m01-rebaseline-01.js|app/prototype/parallel/core-journey-fix-01/demo/m01-rebaseline-01.css|app/prototype/parallel/core-journey-fix-01/demo/m01-service-shell-02.css|app/prototype/parallel/core-journey-fix-01/demo/m01-lifecycle-shell-02.css) ;;
              *) echo "OUT_OF_SCOPE_APP $f"; exit 1 ;;
            esac
          done < /tmp/h01m01_appscope.txt
          for f in app/prototype/parallel/core-journey-fix-01/demo/{app,account,h01-state-policy-01,lifecycle-ui,m01-rebaseline-01,demo-core}.js scripts/verify_h01_m01_contract_01_browser.cjs; do node --check "$f"; done
          node qa/test_h01_order_payment_3h.cjs
          node qa/test_h01_state_implement_01.cjs
          node qa/test_h01_postpay_access_deposit_01.cjs
          if grep -q KOALA-LOCAL app/prototype/parallel/core-journey-fix-01/demo/account.js; then echo 'FAKE_DOOR_CODE_LEAK'; exit 1; fi
          test "$(git show HEAD:app/prototype/parallel/core-journey-fix-01/demo/demo-core.js | sha256sum | cut -d' ' -f1)" = "$(git show f08bafb95dcc826aecb0053dfbdefb4f047580c7:app/prototype/parallel/core-journey-fix-01/demo/demo-core.js | sha256sum | cut -d' ' -f1)"
      - name: Install Chinese fonts and browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Cross-page 375 390 and 3h state verification
        run: node scripts/verify_h01_m01_contract_01_browser.cjs
      - name: Upload exact candidate screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h01-m01-contract-01-375-390-evidence
          path: release-evidence/h01-m01-contract-01/
          retention-days: 7
          if-no-files-found: warn
