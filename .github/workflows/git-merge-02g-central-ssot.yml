name: GIT-MERGE-02G canonical demo runtime
on:
  push:
    branches:
      - feature/git-merge-02g-central-ssot-20261027
  workflow_dispatch:
permissions:
  contents: read
jobs:
  central-contract-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check canonical source and stable core behavior
        working-directory: app/prototype/parallel/core-journey-fix-01
        run: |
          set -e
          node --check qa/test_merge02g_contract.js
          node --check qa/test_merge02g_browser.cjs
          node qa/test_merge02g_contract.js
          node demo/qa/test_merge02c_policy.js
          node demo/qa/test_mainchain_decision.js
          node demo/qa/test_model.js
      - name: Install Playwright and Chromium
        working-directory: app/prototype/parallel/core-journey-fix-01
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Central launcher 375 and 390 user journey
        working-directory: app
        run: |
          python3 -m http.server 4270 --bind 127.0.0.1 >/tmp/central-02g.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 3
          node prototype/parallel/core-journey-fix-01/qa/test_merge02g_browser.cjs
      - name: Upload private central integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge02g-central-ssot-private
          path: app/prototype/parallel/core-journey-fix-01/evidence/merge02g
          if-no-files-found: warn
          retention-days: 7
