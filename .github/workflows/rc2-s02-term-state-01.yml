name: RC2 S02 TERM STATE 01 - 375-390 no deploy
on:
  push:
    branches: [isolate/rc2-s02-term-state-01-20261112]
    paths:
      - .github/workflows/rc2-s02-term-state-01.yml
      - app/prototype/parallel/core-journey-fix-01/demo/app.js
      - scripts/verify_rc2_s02_term_state_01_browser.cjs
      - docs/RC2_S02_TERM_STATE_01_20261112.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc2-s02-term-state-01
  cancel-in-progress: true
jobs:
  s02-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Exact SHA and isolated S02 source scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "isolate/rc2-s02-term-state-01-20261112"
          git diff --name-only 338eaa6436bcbef37399eda4bc44c1a01177f74d HEAD -- app/ > /tmp/s02-source-scope.txt
          cat /tmp/s02-source-scope.txt
          test "$(wc -l </tmp/s02-source-scope.txt)" = 1
          grep -qx 'app/prototype/parallel/core-journey-fix-01/demo/app.js' /tmp/s02-source-scope.txt
          node --check app/prototype/parallel/core-journey-fix-01/demo/app.js
          node --check scripts/verify_rc2_s02_term_state_01_browser.cjs
      - name: Preserve pricing lifecycle and geometric source contracts
        run: |
          node scripts/verify_rc2_business_rebuild_01.cjs
          node scripts/verify_rc2_final_vis_signoff_04_contract.cjs
          node scripts/verify_rc2_vis_signoff_02_geometry.cjs
          node scripts/verify_vis_system_04b1_tag_semantics.cjs
          node qa/test_h01_order_payment_3h.cjs
      - name: Build exact branch bundle without deployment
        env:
          RC2_BUNDLE_LABEL: RC2-S02-TERM-STATE-01
          RC2_BUNDLE_ARCHIVE: MiniKoala_RC2_S02_TERM_STATE_01.zip
          RC2_BUNDLE_BRANCH: isolate/rc2-s02-term-state-01-20261112
          RC2_BUNDLE_SOURCE_PR: '134'
          RC2_BUNDLE_BASE_PR: '134'
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Check bundle provenance
        run: |
          node -e "const v=require('./release-evidence/rc2-merge-prep-10/site/rc2-uat-version.json');if(v.source_sha!==process.env.GITHUB_SHA||v.source_branch!==process.env.GITHUB_REF_NAME)throw Error('BUNDLE_SHA_MISMATCH');console.log(v.source_sha)"
      - name: Install Chromium and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: S02 browse capacity-only confirmed and order-term gate 375 390
        run: node scripts/verify_rc2_s02_term_state_01_browser.cjs
      - name: S02 previously approved navigation services and touch targets 375 390
        run: node scripts/verify_s02_fix_01_browser.cjs
      - name: S02 warehouse dimensions and lease prices 375 390
        run: node scripts/verify_rc2_final_vis_signoff_02_browser.cjs
      - name: Preserve S01 S5 O01 matching prices and cabin IDs 375 390
        run: node scripts/verify_s5_s01_vis_signoff_04_browser.cjs
      - name: Preserve S5 mandatory capacity and term 16 states and entry gates
        run: node scripts/verify_s5_final_vis_signoff_04c_states_browser.cjs
      - name: Preserve H01 S01 S02 S5 M01 page smoke
        run: node scripts/verify_rc2_h01_m01_integration_01_browser.cjs
      - name: Upload same SHA S02 screenshots and state results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC2-S02-TERM-STATE-01-375390
          retention-days: 7
          if-no-files-found: warn
          path: |
            release-evidence/rc2-s02-term-state-01/
            release-evidence/s02-fix-01/
            release-evidence/rc2-final-vis-signoff-02/
            release-evidence/s5-final-vis-signoff-04/
            release-evidence/s5-final-vis-signoff-04c/
            release-evidence/rc2-h01-m01-integration-01/
            release-evidence/rc2-merge-prep-10/site/rc2-uat-version.json
