name: PRICE-INTEGER-CONTRACT-01 isolated rent QA NO DEPLOY
on:
  push:
    branches: [isolate/price-integer-contract-01-20261111]
    paths:
      - '.github/workflows/price-integer-contract-01.yml'
      - 'scripts/verify_price_integer_contract_01.cjs'
      - 'scripts/verify_rc2_business_rebuild_01.cjs'
      - 'scripts/verify_s5_final_rebase_01_browser.cjs'
      - 'app/prototype/parallel/core-journey-fix-01/demo/demo-core.js'
      - 'app/prototype/parallel/core-journey-fix-01/demo/presentation-policy.js'
      - 'app/prototype/parallel/core-journey-fix-01/demo/app.js'
      - 'app/prototype/parallel/core-journey-fix-01/demo/lifecycle-ui.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  price:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Node syntax and 1–60 month integer source contract
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          node --check app/prototype/parallel/core-journey-fix-01/demo/demo-core.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/app.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/presentation-policy.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/lifecycle-ui.js
          node scripts/verify_price_integer_contract_01.cjs
          node scripts/verify_rc2_business_rebuild_01.cjs
      - name: Build isolated demo, no deployment
        env:
          RC2_BUNDLE_LABEL: PRICE-INTEGER-CONTRACT-01-ISOLATED
          RC2_BUNDLE_BRANCH: isolate/price-integer-contract-01-20261111
          RC2_BUNDLE_SOURCE_PR: "117"
          RC2_BUNDLE_BASE_PR: "101"
          RC2_BUNDLE_ARCHIVE: MiniKoala_PRICE_INTEGER_CONTRACT_01.zip
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Verify exact source identity in generated manifest
        run: |
          node -e "const p=require('./release-evidence/rc2-merge-prep-10/site/rc2-uat-version.json');if(p.source_sha!==process.env.GITHUB_SHA||p.source_branch!=='isolate/price-integer-contract-01-20261111'||p.source_pr!==117)process.exit(1);console.log('PRICE_IDENTITY_OK',p.source_sha,p.source_pr)"
      - name: Chromium and CJK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: S5 375 and 390 real browser regression
        run: node scripts/verify_s5_final_rebase_01_browser.cjs
      - name: Preserve evidence, no deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PRICE-INTEGER-CONTRACT-01-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            release-evidence/s5-final-rebase-01/
            release-evidence/rc2-merge-prep-10/build-summary.json
            release-evidence/rc2-merge-prep-10/site/rc2-uat-version.json
