name: RC2 MOTION MERGE GATE 01 - same SHA navigation and full journey
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [isolate/motion-s01-s5-01g-20261113]
    paths:
      - .github/workflows/rc2-motion-merge-gate-01.yml
      - scripts/verify_rc2_motion_merge_gate_01_*
      - docs/RC2_MOTION_MERGE_GATE_01_20261113.md
permissions:
  contents: read
concurrency:
  group: rc2-motion-merge-gate-01-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  unified-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Pin unique source and prohibit app mutations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_HEAD_REF" = "isolate/rc2-motion-merge-gate-01-20261113"
          test "$GITHUB_BASE_REF" = "isolate/motion-s01-s5-01g-20261113"
          node --check scripts/verify_rc2_motion_merge_gate_01_contract.cjs
          node --check scripts/verify_rc2_motion_merge_gate_01_nav_browser.cjs
          node --check scripts/verify_rc2_motion_merge_gate_01_nav_capture.cjs
          node --check scripts/verify_rc2_motion_merge_gate_01_nav_optics.cjs
          node scripts/verify_rc2_motion_merge_gate_01_contract.cjs
      - name: Cross-module pricing order state and auth contract
        run: |
          set -euo pipefail
          node scripts/verify_motion_s01_s5_01b.cjs
          node scripts/verify_motion_s01_s5_01c_contract.cjs
          node scripts/verify_motion_s01_s5_01e_coordinate.cjs
          node scripts/test_cap_unit_dual_01.js
          node scripts/verify_rc2_business_rebuild_01.cjs
          node scripts/verify_rc2_final_vis_signoff_04_contract.cjs
          node qa/test_h01_order_payment_3h.cjs
          node qa/test_h01_state_implement_01.cjs
          node qa/test_h01_postpay_access_deposit_01.cjs
          node scripts/verify_h01_m01_flow_qa_01.cjs
      - name: Build same SHA isolated review site no deployment
        env:
          RC2_BUNDLE_BRANCH: ${{ github.head_ref }}
          RC2_BUNDLE_SOURCE_PR: ${{ github.event.pull_request.number }}
          RC2_BUNDLE_BASE_PR: '168'
          RC2_BUNDLE_LABEL: RC2-MOTION-MERGE-GATE-01-UNIFIED-REVIEW
          RC2_BUNDLE_ARCHIVE: MiniKoala_RC2_MOTION_MERGE_GATE_01.zip
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Enforce exact review identity and same runtime binaries
        shell: bash
        env:
          EXPECT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node -e "const v=require('./release-evidence/rc2-merge-prep-10/site/rc2-uat-version.json');if(v.source_sha!==process.env.GITHUB_SHA||v.source_branch!==process.env.GITHUB_HEAD_REF||v.source_pr!==Number(process.env.EXPECT_PR))throw Error('UNIFIED_SOURCE_IDENTITY_MISMATCH');console.log('UNIFIED_IDENTITY_OK',v.source_sha,v.source_branch,v.source_pr)"
          live=app/prototype/parallel/core-journey-fix-01/demo
          built=release-evidence/rc2-merge-prep-10/site/prototype/parallel/core-journey-fix-01/demo
          for f in app.js home.html visual-align.css br04/bridge.js br04/s5/location-ranker.js s01-r2-bind.js s01-motion-micro-01b.css; do
            cmp "$live/$f" "$built/$f" || { echo "SOURCE_RUNTIME_MISMATCH:$f"; exit 1; }
          done
      - name: Install Chromium and Chinese fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          test -n "$(fc-list :lang=zh family | head -1)"
      - name: H01 20 state dual-width recovery and no rejected A C
        if: ${{ !cancelled() }}
        env:
          RC2_EXPECT_SHA: ${{ github.sha }}
          RC2_EXPECT_BRANCH: ${{ github.head_ref }}
          RC2_EXPECT_SOURCE_PR: ${{ github.event.pull_request.number }}
          H01_BROWSER_CHANNEL: chromium
        run: node scripts/verify_rc2_single_candidate_03_h01_browser.cjs
      - name: NAV H01 S01 M01 actual states and interactions
        if: ${{ !cancelled() }}
        env:
          RC2_EXPECT_SOURCE_PR: ${{ github.event.pull_request.number }}
        run: |
          node scripts/verify_rc2_motion_merge_gate_01_nav_browser.cjs
          node scripts/verify_rc2_motion_merge_gate_01_nav_capture.cjs
          node scripts/verify_rc2_motion_merge_gate_01_nav_optics.cjs
      - name: NAV H01 pixel guard outside approved caption regions
        if: ${{ !cancelled() }}
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/verify_rc2_motion_merge_gate_01_nav_pixel.py
      - name: CAP cubic square-metre term and ITEMS flows
        if: ${{ !cancelled() }}
        run: |
          node scripts/verify_cap_unit_dual_01_browser.cjs
          node scripts/verify_rc2_merge_prep_04_cap_items_browser.cjs
      - name: S01 list filtering card rank E storage and S02 detail
        if: ${{ !cancelled() }}
        run: |
          node scripts/verify_rc2_single_candidate_03_s01_browser.cjs
          node scripts/verify_rc2_s02_term_state_01_browser.cjs
          node scripts/verify_rc2_s02_photo_source_01_browser.cjs
      - name: S5 multiple states and decision path
        if: ${{ !cancelled() }}
        run: node scripts/verify_s5_final_vis_signoff_04c_states_browser.cjs
      - name: S5 to S01 selected origin and E storage fallback state
        if: ${{ !cancelled() }}
        run: |
          node scripts/verify_motion_s01_s5_01c_browser.cjs
          node scripts/verify_motion_s01_s5_01g_browser.cjs
      - name: H01 S01 S02 S5 M01 and order state integration
        if: ${{ !cancelled() }}
        run: |
          node scripts/verify_rc2_h01_m01_integration_01_browser.cjs
          node scripts/verify_rc2_final_vis_signoff_04_browser.cjs
      - name: Upload inspectable same-source QA only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC2-MOTION-MERGE-GATE-01-375-390
          retention-days: 5
          if-no-files-found: warn
          path: |
            release-evidence/rc2-motion-merge-gate-01-nav/
            release-evidence/rc2-motion-merge-gate-01-nav-final/
            release-evidence/rc2-motion-merge-gate-01-nav-optics/
            release-evidence/motion-s01-s5-01c/
            release-evidence/motion-s01-s5-01g/
            release-evidence/rc2-single-candidate-03-h01/
            release-evidence/cap-unit-dual-01/
            release-evidence/rc2-merge-prep-04/
            release-evidence/rc2-single-candidate-03-s01/
            release-evidence/rc2-s02-term-state-01/
            release-evidence/rc2-s02-photo-source-01/
            release-evidence/s5-final-vis-signoff-04c/
            release-evidence/rc2-h01-m01-integration-01/
            release-evidence/rc2-final-vis-signoff-04/
            release-evidence/rc2-merge-prep-10/site/rc2-uat-version.json
            release-evidence/rc2-merge-prep-10/build-summary.json
