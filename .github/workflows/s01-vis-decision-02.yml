name: S01 VIS DECISION 02 isolated 375 390 NO DEPLOY
on:
  push:
    branches:
      - feature/s01-vis-decision-02-20261111
    paths:
      - .github/workflows/s01-vis-decision-02.yml
      - app/prototype/parallel/core-journey-fix-01/demo/s01-vis-decision-02.css
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s01-vis-decision-02-review
  cancel-in-progress: true
jobs:
  verify-s01:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Source syntax check
        run: |
          node --check app/prototype/parallel/core-journey-fix-01/demo/app.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/s01-r2-bind.js
          node --check scripts/verify_s01_vis_decision_02_browser.cjs
          node scripts/verify_rc2_business_rebuild_01.cjs
      - name: Build exact isolated candidate, without deployment
        env:
          RC2_BUNDLE_BRANCH: feature/s01-vis-decision-02-20261111
          RC2_BUNDLE_LABEL: S01-VIS-DECISION-02-ISOLATED
          RC2_BUNDLE_ARCHIVE: MiniKoala_S01_VIS_DECISION_02_NO_DEPLOY.zip
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Install Chromium and Chinese fonts
        run: |
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: New S01 public price, filter sticky and no-match journeys 375/390
        run: node scripts/verify_s01_vis_decision_02_browser.cjs
      - name: Preserve exact branch screenshots, JSON and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-vis-decision-02-browser-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            release-evidence/s01-vis-decision-02/
            release-evidence/rc2-merge-prep-10/build-summary.json
