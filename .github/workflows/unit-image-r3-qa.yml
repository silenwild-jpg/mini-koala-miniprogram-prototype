name: UNIT-IMAGE-R3 real-browser 375-390 NO DEPLOY
on:
  push:
    branches: [isolate/unit-image-rebuild-01-r3-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Node syntax guards
        run: |
          node --check app/prototype/parallel/core-journey-fix-01/demo/app.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/br04/bridge.js
          node --check scripts/verify_unit_image_r3_browser.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build this exact isolated candidate (no deployment)
        env:
          RC2_BUNDLE_BRANCH: isolate/unit-image-rebuild-01-r3-20261103
          RC2_BUNDLE_LABEL: UNIT-IMAGE-REBUILD-01-R3
          RC2_BUNDLE_ARCHIVE: MiniKoala_UNIT_IMAGE_R3_Candidate_20261103.zip
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Real Chromium CAP/S02 375 and 390 image loads
        run: node scripts/verify_unit_image_r3_browser.cjs
      - name: All 16 pages two-width browser regression
        run: node scripts/verify_rc2_vis_integration_02_browser.cjs
      - name: Upload private screenshots, never deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-image-r3-private-browser-evidence
          path: |
            release-evidence/unit-image-r3/
            release-evidence/rc2-vis-integration-02/
            release-evidence/rc2-merge-prep-10/build-summary.json
          if-no-files-found: warn
          retention-days: 14
