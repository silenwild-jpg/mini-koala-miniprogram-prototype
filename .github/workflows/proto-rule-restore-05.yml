name: PROTO-RULE-RESTORE-05 final consistency and evidence gate
on:
  push:
    branches:
      - isolate/proto-rule-restore-05-audit-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit source and freeze existing visuals
        run: |
          node --check app/prototype/parallel/core-journey-fix-01/demo/app.js
          node --check scripts/verify_proto_rule_restore_05.cjs
          node --check scripts/verify_rc2_rule_fix_01d_browser.cjs
          node scripts/verify_proto_rule_restore_05.cjs
          git diff --name-only f33d0a1323aae45dbb4127a27832b3d5e4e3e3c7 HEAD | tee /tmp/restore05-diff.txt
          ! grep -E '^app/(assets/|prototype/parallel/core-journey-fix-01/demo/assets/)' /tmp/restore05-diff.txt
      - name: Upload rule receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore05-source-and-gates
          path: release-evidence/rule-restore-05/static.json
          if-no-files-found: warn
  browser:
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Assemble isolated internal review artifact (never deploy)
        env:
          RC2_BUNDLE_LABEL: PROTO-RULE-RESTORE-05-ISOLATED-20261103
          RC2_BUNDLE_ARCHIVE: MiniKoala_PROTO_RULE_RESTORE_05_20261103.zip
          RC2_BUNDLE_BRANCH: isolate/proto-rule-restore-05-audit-20261103
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: S01 three filters, U01 legacy and S5 map regression 375 and 390
        run: |
          node scripts/verify_rc2_merge_prep_09_bundle_browser.cjs
          node scripts/verify_proto_rule_restore_04.cjs
          node scripts/verify_proto_rule_restore_04_browser.cjs
      - name: Full journey and RN01 invalid-input stability repeated twice
        run: |
          node scripts/verify_rc2_rule_fix_01d_browser.cjs
          node scripts/verify_rc2_rule_fix_01d_browser.cjs
      - name: Upload technical screenshots and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore05-private-evidence-375-390
          path: |
            release-evidence/rc2-merge-prep-10/build-summary.json
            release-evidence/rc2-merge-prep-10/isolated-bundle-smoke.json
            release-evidence/rc2-merge-prep-10/isolated-S01-distance-*.png
            release-evidence/rc2-merge-prep-10/MiniKoala_PROTO_RULE_RESTORE_05_20261103.zip
            release-evidence/rule-restore-04/
            release-evidence/rc2-fix-01d/summary.json
            release-evidence/rc2-fix-01d/*.png
          if-no-files-found: warn
          retention-days: 14
