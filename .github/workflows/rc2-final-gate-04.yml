name: RC2-FINAL-GATE-04 source-frozen technical gate NO DEPLOY
on:
  push:
    branches: [isolate/rc2-final-gate-04-20261112]
    paths:
      - '.github/workflows/rc2-final-gate-04.yml'
      - 'scripts/verify_rc2_final_gate_04.cjs'
      - 'docs/RC2_FINAL_GATE_04_20261112.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc2-final-gate-04
  cancel-in-progress: true
jobs:
  premerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: VIS-GUARD confirm no production changes from PR122
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --exit-code origin/isolate/rc2-final-visual-review-03-20261112...HEAD -- app/prototype/parallel/core-journey-fix-01/demo
      - name: Verify frozen page rules and main merge NO-GO
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/verify_rc2_final_gate_04.cjs
          node scripts/verify_rc2_final_gate_04.cjs
          node scripts/verify_vis_system_04b1_tag_semantics.cjs
      - name: Existing integer price, H01 and lifecycle Node regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify_price_integer_contract_01.cjs
          node scripts/verify_rc2_business_rebuild_01.cjs
          node qa/test_h01_state_implement_01.cjs
          node qa/test_h01_order_payment_3h.cjs
          node qa/test_h01_postpay_access_deposit_01.cjs
      - name: Build exact SHA isolated demo NO DEPLOY
        env:
          RC2_BUNDLE_LABEL: RC2-FINAL-GATE-04
          RC2_BUNDLE_BRANCH: isolate/rc2-final-gate-04-20261112
          RC2_BUNDLE_SOURCE_PR: '124'
          RC2_BUNDLE_BASE_PR: '122'
          RC2_BUNDLE_ARCHIVE: MiniKoala_RC2_FINAL_GATE_04.zip
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Check exact-SHA source manifest and disallow main merge
        shell: bash
        run: |
          node -e "const f=require('fs');const v=JSON.parse(f.readFileSync('release-evidence/rc2-merge-prep-10/site/rc2-uat-version.json'));const gate=JSON.parse(f.readFileSync('release-evidence/rc2-final-gate-04/gate-results.json'));if(v.source_sha!==process.env.GITHUB_SHA||v.source_pr!==124||v.source_branch!=='isolate/rc2-final-gate-04-20261112'||gate.readiness.main_merge!=='NO_GO'||gate.current_runtime_delta_vs_pr122!==0)process.exit(1);console.log('FINAL_GATE_04_EXACT_SHA_NO_GO',v.source_sha)"
      - name: Upload small premerge JSON and source manifest only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC2-FINAL-GATE-04-premerge-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            release-evidence/rc2-final-gate-04/gate-results.json
            release-evidence/rc2-merge-prep-10/site/rc2-uat-version.json
            release-evidence/rc2-merge-prep-10/build-summary.json
