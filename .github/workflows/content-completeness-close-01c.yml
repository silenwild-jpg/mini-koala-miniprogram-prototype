name: CONTENT COMPLETENESS CLOSE 01C
on:
  push:
    branches: ['fix/content-completeness-close-01c-20261117*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bind evidence to actual checkout
        run: |
          mkdir -p release-evidence/content-close-01c
          git rev-parse HEAD | tee release-evidence/content-close-01c/head.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 0a687932d3daef8b559101e5c5df387ada388fbd -- app/prototype/parallel/core-journey-fix-01/demo/home.html app/prototype/parallel/core-journey-fix-01/demo/br03-demo-snapshots.js app/prototype/parallel/core-journey-fix-01/demo/promotion-policy.js
      - name: State, pricing and promotion regressions
        run: |
          set -o pipefail
          for test in test_01c_ux_copy_01.cjs test_content_completeness_close_01c.cjs test_wb_demo_consistency_01.js test_cap_unit_dual_01.js test_promo_entitlement_model_01.js test_promo_source_01.js test_promo_demo_scenarios_01.js; do
            node "scripts/$test" | tee "release-evidence/content-close-01c/$test.log"
          done
      - name: Install pinned browser dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Lead, enterprise, ITEMS and service states at 375 and 390
        run: node scripts/verify_content_completeness_close_01c_browser.cjs
      - name: User copy and reviewer isolation at 375 and 390
        run: node scripts/verify_01c_ux_copy_01_browser.cjs
      - name: Existing booking QUICK O01 and gift-price regressions
        run: |
          node scripts/verify_rc2_merge_ready_04_browser.cjs
          node scripts/verify_rc2_final_vis_signoff_04_browser.cjs
          node scripts/verify_cap_unit_dual_01_browser.cjs
          node scripts/verify_demo_scenarios_browser_01.cjs
      - name: Confirm source unchanged during verification
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CONTENT-COMPLETENESS-CLOSE-01C-${{ github.sha }}
          retention-days: 14
          path: |
            release-evidence/content-close-01c/
            release-evidence/01c-ux-copy-01/
            release-evidence/rc2-merge-ready-04/
            release-evidence/rc2-final-vis-signoff-04/
            release-evidence/cap-unit-dual-01/
            release-evidence/demo-scenarios-01/
