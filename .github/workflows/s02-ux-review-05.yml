name: S02 UX REVIEW 05 dual-size browser QA
on:
  push:
    branches:
      - isolate/s02-ux-review-03-hours-routes-copy-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test six S02 states at both widths
        run: node scripts/verify_s02_ux_review_05_browser.cjs
      - name: Store screenshots and machine report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s02-ux-review-05-screenshots
          path: release-evidence/s02-ux-review-05/
          if-no-files-found: warn
