name: RC2-MERGE-PREP-01 three-source isolated QA
on:
  push:
    branches:
      - isolate/rc2-merge-prep-01-visual-plus-lifecycle-20261102
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert approved R2 asset SHAs and lifecycle routes
        run: |
          node --check app/prototype/parallel/core-journey-fix-01/demo/app.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/br04/bridge.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/demo-core.js
          node --check scripts/verify_rc2_merge_prep_01_browser.cjs
          node scripts/verify_rc2_merge_prep_01.cjs
          node scripts/verify_rc2_rule_fix_01b.cjs
          node scripts/verify_rc2_rule_fix_01c.cjs
  browser:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: PR35 life-cycle 375/390 regression
        run: node scripts/verify_rc2_rule_fix_01c_browser.cjs
      - name: PR35 main journey 375/390 regression
        run: node scripts/verify_rc2_rule_fix_01d_browser.cjs
      - name: PR33 R2 visual and PR35 aftercare integrated 375/390
        run: node scripts/verify_rc2_merge_prep_01_browser.cjs
      - name: Attach private screenshots and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-merge-prep-01-isolated-evidence
          path: |
            release-evidence/rc2-fix-01c/
            release-evidence/rc2-fix-01d/
            release-evidence/rc2-merge-prep-01/
          if-no-files-found: warn
