name: PROTO-RULE-RESTORE-06 single S01 and visual source gate
on:
  push:
    branches:
      - isolate/proto-rule-restore-06-single-s01-hifi-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Code syntax and source visual gate
        run: |
          node --check app/prototype/parallel/core-journey-fix-01/demo/app.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/home-bridge.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/items-bridge.js
          node --check scripts/verify_proto_rule_restore_06.cjs
          node --check scripts/verify_proto_rule_restore_06_browser.cjs
          python3 -m py_compile scripts/build_rc2_isolated_demo.py
          node scripts/verify_proto_rule_restore_05.cjs
          node scripts/verify_proto_rule_restore_06.cjs
      - name: Freeze approved assets
        run: |
          git diff --name-only c7f61f159f4f9a59f382faf6411c32305dc4d634 HEAD | tee /tmp/restore06-changed.txt
          ! grep -E '^app/(assets/|prototype/parallel/core-journey-fix-01/demo/assets/)' /tmp/restore06-changed.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restore06-visual-source-qa
          path: release-evidence/rule-restore-06/source-visual-gate.json
          if-no-files-found: warn
  browser:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Chromium and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build isolated RC2 with immutable VIS-11J assets
        env:
          RC2_BUNDLE_LABEL: PROTO-RULE-RESTORE-06-ISOLATED-20261103
          RC2_BUNDLE_ARCHIVE: MiniKoala_PROTO_RULE_RESTORE_06_20261103.zip
          RC2_BUNDLE_BRANCH: isolate/proto-rule-restore-06-single-s01-hifi-20261103
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Canonical S01 and H01 source visual tests 375/390
        run: |
          node scripts/verify_proto_rule_restore_06_browser.cjs
          node scripts/verify_rc2_merge_prep_09_bundle_browser.cjs
          node scripts/verify_proto_rule_restore_04.cjs
          node scripts/verify_proto_rule_restore_04_browser.cjs
      - name: End-to-end checkout aftercare and RN01 twice
        run: |
          node scripts/verify_rc2_rule_fix_01d_browser.cjs
          node scripts/verify_rc2_rule_fix_01d_browser.cjs
      - name: Upload private screenshot and isolated site archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore06-single-S01-visual-375-390
          path: |
            release-evidence/rule-restore-06/
            release-evidence/rc2-merge-prep-10/build-summary.json
            release-evidence/rc2-merge-prep-10/isolated-S01-distance-*.png
            release-evidence/rc2-merge-prep-10/MiniKoala_PROTO_RULE_RESTORE_06_20261103.zip
            release-evidence/rc2-fix-01d/summary.json
            release-evidence/rc2-fix-01d/*.png
          if-no-files-found: warn
          retention-days: 14
