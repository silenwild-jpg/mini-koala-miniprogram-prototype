name: RC2 FINAL VIS SIGNOFF 03 after-sales states 375/390 NO DEPLOY
on:
  push:
    branches: [isolate/rc2-final-vis-signoff-03-20261112]
    paths: [.github/workflows/rc2-final-vis-signoff-03.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc2-final-vis-signoff-03-only
  cancel-in-progress: true
jobs:
  visual-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Parent scope and RC2 non-regression contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --name-only c0c7bab56ed16a041ae7a4119e6893e50d1659f2 HEAD -- app/ > /tmp/rc2-vis03-scope
          cat /tmp/rc2-vis03-scope
          while IFS= read -r file; do
            case "$file" in
              app/prototype/parallel/core-journey-fix-01/demo/app.js|app/prototype/parallel/core-journey-fix-01/demo/account.js|app/prototype/parallel/core-journey-fix-01/demo/demo-core.js|app/prototype/parallel/core-journey-fix-01/demo/lifecycle-ui.js) ;;
              *) echo "P0_SCOPE_VIOLATION: $file"; exit 1 ;;
            esac
          done < /tmp/rc2-vis03-scope
          for file in app/prototype/parallel/core-journey-fix-01/demo/{app,account,demo-core,lifecycle-ui,h01-state-policy-01,m01-rebaseline-01}.js scripts/verify_rc2_final_vis_signoff_03_browser.cjs scripts/verify_{h01_m01_flow_qa_01_browser,m01_ia_03_browser,h01_m01_contract_01_browser,rc2_h01_m01_integration_01_browser}.cjs; do node --check "$file"; done
          node scripts/verify_rc2_business_rebuild_01.cjs
          node scripts/verify_rc2_vis_signoff_02_geometry.cjs
          node scripts/verify_vis_system_04b1_tag_semantics.cjs
          node qa/test_h01_order_payment_3h.cjs
          node qa/test_h01_postpay_access_deposit_01.cjs
          node scripts/verify_m01_ia_03.cjs
          node scripts/verify_h01_m01_flow_qa_01.cjs
          node scripts/verify_h01_m01_business_date_01.cjs
      - name: Install Chromium and Chinese text fonts
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROME_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          fi
          if ! fc-list :lang=zh 2>/dev/null | grep -q .; then sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk; fi
          npm_config_fetch_retries=1 npm_config_fetch_timeout=45000 npm install --no-save --no-package-lock --prefer-offline playwright@1.56.1
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1; then npx playwright install chromium; fi
      - name: O03 RN01 EX01 DP01 IV01 lifecycle forms plus isolated S02 thumbnails 375 and 390
        run: node scripts/verify_rc2_final_vis_signoff_03_browser.cjs
      - name: Preserve H01 M01 accurate order history and no deposit regressions
        run: node scripts/verify_h01_m01_flow_qa_01_browser.cjs
      - name: Preserve M01 multi-warehouse lifecycle visuals
        run: node scripts/verify_m01_ia_03_browser.cjs
      - name: Preserve 3h payment identity and refunds
        run: node scripts/verify_h01_m01_contract_01_browser.cjs
      - name: Preserve RC2 H01 S01 S02 S5 M01 single-candidate 375 390 baseline
        run: node scripts/verify_rc2_h01_m01_integration_01_browser.cjs
      - name: Export exact SHA screenshot and result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC2-FINAL-VIS-SIGNOFF-03-375-390
          retention-days: 7
          if-no-files-found: warn
          path: |
            release-evidence/rc2-final-vis-signoff-03/
            release-evidence/h01-m01-flow-qa-01/
            release-evidence/m01-ia-03/
            release-evidence/h01-m01-contract-01/
            release-evidence/rc2-h01-m01-integration-01/
