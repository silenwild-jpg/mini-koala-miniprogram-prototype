name: S01 VIS RESTORE 01 native responsive and all-path QA (NO DEPLOY)
on:
  push:
    branches:
      - isolate/s01-vis-restore-01-native-clean-20261104
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s01-visual-native-and-cross-page:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax, CSS source and VIS-GUARD
        run: |
          set -eu
          for f in app/prototype/parallel/core-journey-fix-01/demo/{app.js,s01-r2-bind.js,s01-r2-content.js} scripts/verify_rc2_s01_structure_browser.cjs scripts/verify_s01_ux_review_{02_browser,03_nine_states_browser}.cjs scripts/verify_s01_vis_restore_01_browser.cjs; do
            node --check "$f"
          done
          if grep -q -- 'scaleApprovedReference\|width:358px\|var(--scale' app/prototype/parallel/core-journey-fix-01/demo/s01-r2-live.html; then
            echo 'FATAL: legacy scaled canvas remains'; exit 1
          fi
          if grep -q 'grid-template-columns:repeat(4' app/prototype/parallel/core-journey-fix-01/demo/s01-r2-live.html; then
            echo 'FATAL: four-filter S01 regression'; exit 1
          fi
      - name: Install native Chromium and Chinese typography
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build same-SHA isolated candidate
        env:
          RC2_BUNDLE_LABEL: S01-VIS-RESTORE-01-ISOLATED
          RC2_BUNDLE_ARCHIVE: MiniKoala_S01_VIS_RESTORE_01_Candidate_20261104.zip
          RC2_BUNDLE_BRANCH: isolate/s01-vis-restore-01-native-clean-20261104
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Existing search, filtering and city
        run: node scripts/verify_rc2_s01_structure_browser.cjs
      - name: Third fixed EStore and fourth+ compact contract
        run: node scripts/verify_s01_ux_review_02_browser.cjs
      - name: Nine scenario states with screenshots
        run: node scripts/verify_s01_ux_review_03_nine_states_browser.cjs
      - name: Native geometry, image load, visible card layout, real screenshots
        run: node scripts/verify_s01_vis_restore_01_browser.cjs
      - name: Phone guard, order, payment and cross-page return
        run: node scripts/verify_rc2_rule_fix_01d_browser.cjs
      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-vis-restore-01-native-375-390-evidence
          path: |
            release-evidence/s01-vis-restore-01/
            release-evidence/s01-ux-review-03/
            release-evidence/s01-ux-review-02/
            release-evidence/rc2-structure-restore/
            release-evidence/rc2-fix-01d/
            release-evidence/rc2-merge-prep-10/build-summary.json
          if-no-files-found: warn
          retention-days: 21
