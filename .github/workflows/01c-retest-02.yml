name: 01C DEFECT FIX-01 Isolated Browser Regression

on:
  push:
    branches:
      - qa/01c-defect-fix-01-validation-v2-20261116
    paths:
      - 'scripts/01c_retest_02_runner.cjs'
      - 'scripts/01c_defect_fix_01_unit.cjs'
      - 'scripts/test_promo_entitlement_model_01.js'
      - 'scripts/test_promo_source_01.js'
      - 'scripts/test_promo_demo_scenarios_01.js'
      - 'scripts/test_wb_demo_consistency_01.js'
      - 'scripts/verify_demo_scenarios_browser_01.cjs'
      - 'docs/01C_RETEST_02_CASE_LIST.md'
      - 'app/prototype/parallel/core-journey-fix-01/demo/**'
      - '.github/workflows/01c-retest-02.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 01c-retest-02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-browser-regression:
    name: 01C-DEFECT-FIX-01 / unit + core + 34 browser runs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated QA branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate runner syntax
        run: node --check scripts/01c_retest_02_runner.cjs

      - name: Install isolated Playwright dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run gift-term transition unit tests
        run: node scripts/01c_defect_fix_01_unit.cjs

      - name: Run promotion entitlement model tests
        run: node scripts/test_promo_entitlement_model_01.js

      - name: Run promotion source and campaign visibility tests
        run: node scripts/test_promo_source_01.js

      - name: Run demo promotion and lifecycle scenario tests
        run: node scripts/test_promo_demo_scenarios_01.js

      - name: Run demo pricing and requirement consistency tests
        run: node scripts/test_wb_demo_consistency_01.js

      - name: Run full demo scenario browser verification
        run: node scripts/verify_demo_scenarios_browser_01.cjs

      - name: Execute 34 isolated browser runs
        run: node scripts/01c_retest_02_runner.cjs

      - name: Add regression summary to workflow report
        if: always()
        run: |
          if [ -f release-evidence/01c-retest-02/RETEST02_SUMMARY.json ]; then
            node -e 'const s=require("./release-evidence/01c-retest-02/RETEST02_SUMMARY.json"); const lines=["## 01C RETEST-02","","| Total | PASS | FAIL | BLOCKED |","|---:|---:|---:|---:|","| "+s.total+" | "+s.pass+" | "+s.fail+" | "+s.blocked+" |","","| Case | Viewport | Scenario | Result |","|---|---:|---|---|",...s.results.map(r=>"| "+r.case_id+" | "+r.viewport+" | "+r.scenario+" | "+r.result+" |")]; console.log(lines.join("\\n"));' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## 01C RETEST-02' >> "$GITHUB_STEP_SUMMARY"
            echo 'Runner ended before summary creation; inspect job logs and partial evidence.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshots, traces and machine-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 01C-DEFECT-FIX-01-${{ github.run_id }}
          path: |
            release-evidence/01c-retest-02/
            release-evidence/demo-scenarios-01/
          if-no-files-found: warn
          retention-days: 14
