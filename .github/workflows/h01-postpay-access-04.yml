name: H01 after payment access refund and help 375 390 (NO DEPLOY)
on:
  push:
    branches: [feat/h01-afterpay-ble-deposit-help-20261111]
    paths: [.github/workflows/h01-postpay-access-04.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h01-postpay-access-04
  cancel-in-progress: true
jobs:
  h01-04-real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact H01 and lifecycle business logic
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          node --check scripts/verify_h01_postpay_04_browser.cjs
          node --check app/prototype/parallel/core-journey-fix-01/demo/h01-state-impl-01.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/h01-state-policy-01.js
          node qa/test_h01_postpay_access_deposit_01.cjs
          node qa/test_h01_order_payment_3h.cjs
          node qa/test_h01_state_implement_01.cjs
          python3 -m py_compile scripts/build_rc2_isolated_demo.py
      - name: Build isolated source identical H01 review
        env:
          RC2_BUNDLE_BRANCH: feat/h01-afterpay-ble-deposit-help-20261111
          RC2_BUNDLE_SOURCE_PR: "113"
          RC2_BUNDLE_LABEL: H01-POSTPAY-ACCESS-04-REVIEW-ONLY
          RC2_BUNDLE_ARCHIVE: H01_POSTPAY_04_NO_DEPLOY.zip
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Install Chromium and Chinese fonts
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Run real H01 19-status browser and action audit
        env:
          RC2_EXPECT_SHA: ${{ github.sha }}
        run: node scripts/verify_h01_postpay_04_browser.cjs
      - name: Preserve exact source browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PR113_H01_POSTPAY_04_375_390_EVIDENCE
          path: |
            release-evidence/h01-afterpay-04/
            release-evidence/rc2-merge-prep-10/site/rc2-uat-version.json
          retention-days: 7
          if-no-files-found: warn
