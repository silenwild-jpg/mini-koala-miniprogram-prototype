name: VIS SYSTEM 01 S01 visual comparison 375 390 isolated NO DEPLOY
on:
  push:
    branches:
      - design/vis-system-01-s01-layout-20261111
    paths:
      - .github/workflows/vis-system-01.yml
      - app/prototype/parallel/core-journey-fix-01/demo/s01-vis-system-01.css
      - app/prototype/parallel/core-journey-fix-01/demo/s01-r2-bind.js
      - app/prototype/parallel/core-journey-fix-01/demo/global-store-tags.css
      - app/prototype/parallel/core-journey-fix-01/demo/vis-system-01-tokens.css
      - scripts/verify_vis_system_01_browser.cjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vis-system-01-preview
  cancel-in-progress: true
jobs:
  review-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Syntax and fixed business source verification
        run: |
          node --check app/prototype/parallel/core-journey-fix-01/demo/s01-r2-bind.js
          node --check scripts/verify_vis_system_01_browser.cjs
          node scripts/verify_rc2_business_rebuild_01.cjs
      - name: Build this branch exactly, without Netlify or main deployment
        env:
          RC2_BUNDLE_BRANCH: design/vis-system-01-s01-layout-20261111
          RC2_BUNDLE_LABEL: VIS-SYSTEM-01-EXPLORATION-ISOLATED
          RC2_BUNDLE_ARCHIVE: MiniKoala_VIS_SYSTEM_01_NO_DEPLOY.zip
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Install isolated Chrome and Chinese fonts
        run: |
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: S01 baseline vs two live variants 375/390 and stressed prices
        run: node scripts/verify_vis_system_01_browser.cjs
      - name: H01 S01 S02 S5 identical tags and integer prices
        run: node scripts/verify_global_ui_rules_01_browser.cjs
      - name: Save screenshots and all layout metrics even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vis-system-01-375-390-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            release-evidence/vis-system-01/
            release-evidence/global-ui-rules-01/
            release-evidence/rc2-merge-prep-10/build-summary.json
