name: MOTION S01 S5 01G - E storage and fallback dual-width visual QA
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - isolate/motion-s01-s5-01e-20261113
    paths:
      - .github/workflows/motion-s01-s5-01d.yml
      - scripts/verify_motion_s01_s5_01b.cjs
      - scripts/verify_motion_s01_s5_01c_contract.cjs
      - scripts/verify_motion_s01_s5_01c_browser.cjs
      - scripts/verify_motion_s01_s5_01e_coordinate.cjs
      - scripts/verify_motion_s01_s5_01g_browser.cjs
      - app/prototype/parallel/core-journey-fix-01/demo/app.js
      - app/prototype/parallel/core-journey-fix-01/demo/index.html
permissions:
  contents: read
concurrency:
  group: motion-s01-s5-01g-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  location-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin source and run low-cost contract checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_HEAD_REF" = "isolate/motion-s01-s5-01g-20261113"
          test "$GITHUB_BASE_REF" = "isolate/motion-s01-s5-01e-20261113"
          test -z "$(git diff --name-only 0055c1f04981f384acfab11e50a667d0004486f9 HEAD -- app/)" || { echo "UNAUTHORIZED_RUNTIME_CHANGE"; exit 1; }
          node --check scripts/verify_motion_s01_s5_01c_browser.cjs
          node --check scripts/verify_motion_s01_s5_01c_contract.cjs
          node --check scripts/verify_motion_s01_s5_01g_browser.cjs
          node scripts/verify_motion_s01_s5_01b.cjs
          node scripts/verify_motion_s01_s5_01c_contract.cjs
          node scripts/verify_motion_s01_s5_01e_coordinate.cjs
      - name: Build isolated same-commit RC2 web demo, never deploy
        env:
          RC2_BUNDLE_BRANCH: ${{ github.head_ref }}
          RC2_BUNDLE_SOURCE_PR: ${{ github.event.pull_request.number }}
          RC2_BUNDLE_BASE_PR: '167'
          RC2_BUNDLE_LABEL: MOTION-S01-S5-01G-ESTORE-FALLBACK-QA
          RC2_BUNDLE_ARCHIVE: MiniKoala_MOTION_S01_S5_01G.zip
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Verify rendered source identity and exact runtime bytes
        shell: bash
        env:
          EXPECT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node -e "const v=require('./release-evidence/rc2-merge-prep-10/site/rc2-uat-version.json');if(v.source_sha!==process.env.GITHUB_SHA||v.source_branch!==process.env.GITHUB_HEAD_REF||v.source_pr!==Number(process.env.EXPECT_PR))throw Error('QA_BUILD_SOURCE_IDENTITY_MISMATCH');console.log('MOTION-01G SOURCE_SHA_OK',v.source_sha,v.source_branch,v.source_pr)"
          live=app/prototype/parallel/core-journey-fix-01/demo
          built=release-evidence/rc2-merge-prep-10/site/prototype/parallel/core-journey-fix-01/demo
          for f in app.js br04/bridge.js br04/s5/location-ranker.js s01-r2-bind.js s01-motion-micro-01b.css; do
            cmp "$live/$f" "$built/$f" || { echo "MOTION-01G_RUNTIME_MISMATCH: $f"; exit 1; }
          done
      - name: Install Chromium and Chinese UI fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Run two-device S5 to S01 browser flow
        run: node scripts/verify_motion_s01_s5_01c_browser.cjs
      - name: E-storage full card and fallback states at 375/390
        run: node scripts/verify_motion_s01_s5_01g_browser.cjs
      - name: Preserve failure and screenshot evidence for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MOTION-S01-S5-01G-375-390
          path: |
            release-evidence/motion-s01-s5-01c/
            release-evidence/motion-s01-s5-01g/
            release-evidence/rc2-merge-prep-10/site/rc2-uat-version.json
            release-evidence/rc2-merge-prep-10/build-summary.json
          if-no-files-found: warn
          retention-days: 3
