name: MOTION S01 S5 01E - coordinate guard and dual-width browser QA
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - isolate/motion-s01-s5-01d-20261113
    paths:
      - .github/workflows/motion-s01-s5-01d.yml
      - scripts/verify_motion_s01_s5_01b.cjs
      - scripts/verify_motion_s01_s5_01c_contract.cjs
      - scripts/verify_motion_s01_s5_01c_browser.cjs
      - scripts/verify_motion_s01_s5_01e_coordinate.cjs
      - app/prototype/parallel/core-journey-fix-01/demo/app.js
      - app/prototype/parallel/core-journey-fix-01/demo/index.html
permissions:
  contents: read
concurrency:
  group: motion-s01-s5-01e-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  location-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin source and run low-cost contract checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_HEAD_REF" = "isolate/motion-s01-s5-01e-20261113"
          test "$GITHUB_BASE_REF" = "isolate/motion-s01-s5-01d-20261113"
          git diff --name-only bd0f58526b89cb2028fa8f74beb51ed2116556af HEAD -- app/ | sort > /tmp/motion-01e-actual
          printf "%s\n" \
            app/prototype/parallel/core-journey-fix-01/demo/app.js \
            app/prototype/parallel/core-journey-fix-01/demo/br04/bridge.js \
            app/prototype/parallel/core-journey-fix-01/demo/br04/s5/location-ranker.js | sort > /tmp/motion-01e-expected
          diff -u /tmp/motion-01e-expected /tmp/motion-01e-actual
          node --check scripts/verify_motion_s01_s5_01c_browser.cjs
          node --check scripts/verify_motion_s01_s5_01c_contract.cjs
          node scripts/verify_motion_s01_s5_01b.cjs
          node scripts/verify_motion_s01_s5_01c_contract.cjs
          node scripts/verify_motion_s01_s5_01e_coordinate.cjs
      - name: Build isolated same-commit RC2 web demo, never deploy
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Install Chromium and Chinese UI fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Run two-device S5 to S01 browser flow
        run: node scripts/verify_motion_s01_s5_01c_browser.cjs
      - name: Preserve failure and screenshot evidence for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MOTION-S01-S5-01E-375-390
          path: release-evidence/motion-s01-s5-01c/
          if-no-files-found: warn
          retention-days: 3
