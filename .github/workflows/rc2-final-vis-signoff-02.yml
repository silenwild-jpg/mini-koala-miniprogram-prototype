name: RC2 VIS SIGNOFF 02 geometry and 375 390 visual evidence NO DEPLOY
on:
  push:
    branches: [isolate/rc2-final-vis-signoff-02-20261112]
    paths: [.github/workflows/rc2-final-vis-signoff-02.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc2-final-vis-signoff-02-only
  cancel-in-progress: true
jobs:
  signoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Frozen visual master and S02 canonical dimensions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --name-only fafe40c685b885fe15cb127c5a4549f0a7890ef9 HEAD -- app/ | tee /tmp/rc2-visual-source-diff
          test "$(cat /tmp/rc2-visual-source-diff)" = 'app/prototype/parallel/core-journey-fix-01/demo/fixtures.js'
          for f in scripts/verify_rc2_vis_signoff_02_geometry.cjs scripts/verify_rc2_final_vis_signoff_02_browser.cjs scripts/capture_rc2_final_vis_signoff_02_longscroll.cjs; do node --check "$f"; done
          node scripts/verify_rc2_vis_signoff_02_geometry.cjs
          node scripts/verify_rc2_business_rebuild_01.cjs
          node qa/test_h01_order_payment_3h.cjs
          node qa/test_h01_postpay_access_deposit_01.cjs
          node scripts/verify_vis_system_04b1_tag_semantics.cjs
      - name: Chromium and CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then echo "PLAYWRIGHT_CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"; fi
          if ! fc-list :lang=zh 2>/dev/null | grep -q .; then sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk; fi
          npm_config_fetch_retries=1 npm_config_fetch_timeout=45000 npm install --no-save --no-package-lock --prefer-offline playwright@1.56.1
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1; then npx playwright install chromium; fi
      - name: S02 corrected warehouse 375 390 real photos and price contract
        run: node scripts/verify_rc2_final_vis_signoff_02_browser.cjs
      - name: H01 S01 S02 S5 M01 top middle bottom actual scroll screenshots
        run: node scripts/capture_rc2_final_vis_signoff_02_longscroll.cjs
      - name: Exact-source 375 390 five-page RC2 smoke
        run: node scripts/verify_rc2_h01_m01_integration_01_browser.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC2-FINAL-VIS-SIGNOFF-02-375-390-CJK
          retention-days: 7
          if-no-files-found: warn
          path: |
            release-evidence/rc2-final-vis-signoff-02/
            release-evidence/rc2-final-vis-signoff-02-longscroll/
            release-evidence/rc2-h01-m01-integration-01/
