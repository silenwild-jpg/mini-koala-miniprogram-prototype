name: DEMO-MK-RC1 frozen candidate verification
on:
  push:
    branches:
      - release/demo-mk-rc1-20261027
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify RC1 app tree identical to approved PR19 and 9 PR ancestors
        run: |
          set -e
          node scripts/verify_demo_rc1_lock.cjs
      - name: Verify original MK identifiers and both data modes
        working-directory: app/prototype/parallel/core-journey-fix-01
        run: |
          set -e
          MK_CATALOG_MODE=MK node qa/test_merge02j_legacy.cjs
          node qa/test_merge02g_contract.js
          node demo/qa/test_model.js
          node demo/qa/test_mainchain_decision.js
          node qa/test_merge02i_policy.js
      - name: Install Chromium and Chinese font
        working-directory: app/prototype/parallel/core-journey-fix-01
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Five-city MK visual integrity (375/390)
        working-directory: app
        run: |
          python3 -m http.server 4270 --bind 127.0.0.1 >/tmp/rc1-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 3
          node prototype/parallel/core-journey-fix-01/qa/test_merge02k_visual.cjs
      - name: Original MK store checkout and SIM isolation (375/390)
        working-directory: app
        run: |
          python3 -m http.server 4270 --bind 127.0.0.1 >/tmp/rc1-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 3
          node prototype/parallel/core-journey-fix-01/qa/test_merge02j_browser.cjs
      - name: Upload minimal final private receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEMO-MK-RC1-immutable-source-and-smoke
          path: |
            release-evidence/merge02l/
            app/prototype/parallel/core-journey-fix-01/evidence/merge02j/browser-results.json
            app/prototype/parallel/core-journey-fix-01/evidence/merge02k/result.json
          if-no-files-found: warn
          retention-days: 14
