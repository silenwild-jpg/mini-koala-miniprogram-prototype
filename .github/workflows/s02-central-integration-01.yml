name: S02 Central Integration 01 browser QA
on:
  pull_request:
    branches:
      - isolate/rc2-uat-baseline-01-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s02:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check app/prototype/parallel/core-journey-fix-01/demo/app.js
          node --check scripts/verify_s02_central_integration_01_browser.cjs
      - name: Verify S02 against PROTO-VIS-EXEC governance candidate
        env:
          VIS_GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VIS_GUARD_CHANGED_FILES: app/prototype/parallel/core-journey-fix-01/demo/app.js
        run: |
          git fetch --depth=1 origin governance/proto-vis-exec-01-20261103
          git show FETCH_HEAD:scripts/check_proto_vis_exec_01.cjs > scripts/check_proto_vis_exec_01.cjs
          git show FETCH_HEAD:docs/PROTO_VIS_EXEC_01_CONTRACT.json > docs/PROTO_VIS_EXEC_01_CONTRACT.json
          git show FETCH_HEAD:docs/PROTO_VIS_EXEC_01.md > docs/PROTO_VIS_EXEC_01.md
          git show FETCH_HEAD:docs/VISUAL_MANIFEST.md > docs/VISUAL_MANIFEST.md
          node scripts/check_proto_vis_exec_01.cjs --self-test
          node scripts/check_proto_vis_exec_01.cjs
      - name: Verify complete store destination and inventory snapshots
        run: node scripts/verify_s02_inventory_geo_contract.cjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: S02 real browser six-state double size QA
        run: node scripts/verify_s02_central_integration_01_browser.cjs
      - name: Save screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s02-central-integration-01-evidence
          path: release-evidence/s02-central-integration-01/
          if-no-files-found: warn
