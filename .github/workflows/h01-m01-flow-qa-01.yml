name: H01 M01 FLOW QA 01 per-order navigation and lifecycle NO DEPLOY
on:
  push:
    branches: [isolate/h01-m01-flow-qa-01-20261112]
    paths: [.github/workflows/h01-m01-flow-qa-01.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h01-m01-flow-qa-01-only
  cancel-in-progress: true
jobs:
  cross-page-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Strict parent-scope, syntax and data-state gates
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git diff --name-only 8a4e7127954fc48f209b712d7656a9fb567b0340 HEAD -- app/ > /tmp/m01flow-app.txt
          cat /tmp/m01flow-app.txt
          while IFS= read -r f; do
            case "$f" in
              app/prototype/parallel/core-journey-fix-01/demo/app.js|app/prototype/parallel/core-journey-fix-01/demo/index.html|app/prototype/parallel/core-journey-fix-01/demo/m01-order-route-01.js|app/prototype/parallel/core-journey-fix-01/demo/demo-core.js|app/prototype/parallel/core-journey-fix-01/demo/h01-state-policy-01.js|app/prototype/parallel/core-journey-fix-01/demo/m01-rebaseline-01.js) ;;
              *) echo "P0_OUT_OF_SCOPE: $f"; exit 1 ;;
            esac
          done < /tmp/m01flow-app.txt
          for f in app/prototype/parallel/core-journey-fix-01/demo/{app,m01-order-route-01,m01-rebaseline-01,h01-state-policy-01,lifecycle-ui,demo-core}.js scripts/verify_{h01_m01_flow_qa_01,h01_m01_business_date_01,h01_m01_flow_qa_01_browser,h01_m01_contract_01_browser,m01_ia_03,m01_ia_03_browser}.cjs; do node --check "$f"; done
          node qa/test_h01_order_payment_3h.cjs
          node qa/test_h01_state_implement_01.cjs
          node qa/test_h01_postpay_access_deposit_01.cjs
          node scripts/verify_m01_ia_03.cjs
          node scripts/verify_h01_m01_flow_qa_01.cjs
          node scripts/verify_h01_m01_business_date_01.cjs
          if grep -q "KOALA-LOCAL" app/prototype/parallel/core-journey-fix-01/demo/account.js; then
            echo "LEGACY_FAKE_DOOR_CODE"; exit 1
          fi
      - name: System Chrome and Chinese glyph availability
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROME_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          fi
          if ! fc-list :lang=zh 2>/dev/null | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-noto-cjk
          fi
          npm_config_fetch_retries=1 npm_config_fetch_timeout=45000 npm install --no-save --no-package-lock --prefer-offline playwright@1.56.1
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1; then npx playwright install chromium; fi
      - name: Real H01→M01→O03/RN01/EX01/DP01/IV01 browser back/forward 375/390
        run: node scripts/verify_h01_m01_flow_qa_01_browser.cjs
      - name: Preserve previous M01 multi-asset and record browser QA
        run: node scripts/verify_m01_ia_03_browser.cjs
      - name: Preserve shared 3-hour payment and identity lifecycle QA
        run: node scripts/verify_h01_m01_contract_01_browser.cjs
      - name: Upload screenshots and machine readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h01-m01-flow-qa-01-375-390-exact-sha
          path: |
            release-evidence/h01-m01-flow-qa-01/
            release-evidence/m01-ia-03/
            release-evidence/h01-m01-contract-01/
          retention-days: 7
          if-no-files-found: warn
