name: S5-FINAL-REBASE-01 isolated 375-390 review NO DEPLOY
on:
  push:
    branches: [isolate/s5-final-rebase-01-20261111]
    paths:
      - '.github/workflows/s5-final-rebase-01.yml'
      - 'scripts/verify_s5_final_rebase_01_browser.cjs'
      - 'app/prototype/parallel/core-journey-fix-01/demo/br04/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s5-visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Static syntax and invariant checks
        run: |
          node --check app/prototype/parallel/core-journey-fix-01/demo/br04/bridge.js
          node --check scripts/verify_s5_final_rebase_01_browser.cjs
          node scripts/verify_rc2_business_rebuild_01.cjs
      - name: Build isolated S5 review source
        env:
          RC2_BUNDLE_LABEL: S5-FINAL-REBASE-01-ISOLATED
          RC2_BUNDLE_ARCHIVE: MiniKoala_S5_FINAL_REBASE_01.zip
          RC2_BUNDLE_BRANCH: isolate/s5-final-rebase-01-20261111
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Install Chromium and CJK font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Capture S5 two-store, one-store, incomplete and no-match states
        run: node scripts/verify_s5_final_rebase_01_browser.cjs
      - name: Save visual evidence (never deploy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s5-final-rebase-01-375-390-private-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            release-evidence/s5-final-rebase-01/
            release-evidence/rc2-merge-prep-10/build-summary.json
