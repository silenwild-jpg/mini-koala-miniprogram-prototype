name: MK DESIGN-DIRECTION-02 - 375 390 Chromium Evidence
on:
  push:
    branches:
      - work/mk-demo-quality-reset-01-20261115
    paths:
      - .github/workflows/mk-design-direction-02.yml
      - app/design-exploration/mk-design-direction-01.html
      - scripts/verify_mk_design_direction_02_browser.cjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mk-design-direction-02-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-visual-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout the exact isolated branch SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify isolated scope and source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "work/mk-demo-quality-reset-01-20261115"
          test -s app/design-exploration/mk-design-direction-01.html
          node --check scripts/verify_mk_design_direction_02_browser.cjs
      - name: Install Node and browser dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium, Playwright and Chinese fonts
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Real Chromium 375x812 and 390x844 screenshot and interaction checks
        env:
          MK_DESIGN_EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify_mk_design_direction_02_browser.cjs
      - name: Upload isolated A-B comparison and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mk-design-direction-02-${{ github.sha }}
          path: release-evidence/mk-design-direction-02/
          if-no-files-found: warn
          retention-days: 7
