name: S02-FIX-01 isolated 375-390 review NO DEPLOY
on:
  push:
    branches:
      - fix/s02-final-review-01-20261111
    paths:
      - .github/workflows/s02-fix-01.yml
      - scripts/verify_s02_fix_01_browser.cjs
      - app/prototype/parallel/core-journey-fix-01/demo/app.js
      - app/prototype/parallel/core-journey-fix-01/demo/s02-central.css
      - app/prototype/parallel/core-journey-fix-01/demo/index.html
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s02-fix-01-isolated
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: S02 syntax and immutable central business contract
        run: |
          node --check app/prototype/parallel/core-journey-fix-01/demo/app.js
          node --check scripts/verify_s02_fix_01_browser.cjs
          node scripts/verify_rc2_business_rebuild_01.cjs
      - name: Chromium and Chinese fonts for responsive inspection
        run: |
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: S02 first-screen, service, map, capacity and combo at 375/390
        run: node scripts/verify_s02_fix_01_browser.cjs
      - name: Save independent evidence (not UAT, no deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s02-fix-01-browser-evidence
          retention-days: 7
          if-no-files-found: warn
          path: release-evidence/s02-fix-01/
