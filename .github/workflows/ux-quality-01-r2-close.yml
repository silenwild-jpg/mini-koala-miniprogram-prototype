name: UX-QUALITY-01-R2-CLOSE targeted privacy-copy QA
on:
  push:
    branches:
      - isolate/ux-quality-01-r2-close-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted-r2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source integrity and unchanged VIS11J H01
        run: |
          node scripts/verify_rc2_merge_prep_09_source.cjs
          node --check app/prototype/parallel/core-journey-fix-01/demo/phone-auth.js
          node --check scripts/verify_rc2_rule_fix_01d_browser.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Fresh 375/390 policy text, quote guard and O01 payment/aftercare
        run: node scripts/verify_rc2_rule_fix_01d_browser.cjs
      - name: Save screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-r2-close-privacy-and-order-375390
          path: release-evidence/rc2-fix-01d/
          if-no-files-found: warn
