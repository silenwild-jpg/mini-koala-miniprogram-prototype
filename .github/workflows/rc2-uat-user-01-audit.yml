name: RC2-UAT-USER-01 independent browser replay only (NO DEPLOY)
on:
  push:
    branches:
      - audit/rc2-uat-user-01-20261110
    paths:
      - .github/workflows/rc2-uat-user-01-audit.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc2-uat-user-01-audit
  cancel-in-progress: true
jobs:
  browser-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Block runtime drift from deployed RC2 app tree
        run: |
          set -eux
          test "$(git rev-parse HEAD:app)" = 6f96d6dc95c0669aa571e260ff18d0ca097cc3cf
          git diff --exit-code a6b5e7c70b7b44b699369218c2b2ee67401d5c81 HEAD -- app/
          node --check scripts/verify_rc2_uat_user_01_autonomous.cjs
          node scripts/verify_rc2_business_rebuild_01.cjs
      - name: Build frozen isolated RC2 without Netlify deployment
        env:
          RC2_BUNDLE_LABEL: RC2-UAT-USER-01-AUTONOMOUS-SAME-APP-TREE
          RC2_BUNDLE_BRANCH: audit/rc2-uat-user-01-20261110
          RC2_BUNDLE_ARCHIVE: MiniKoala_RC2_UAT_USER_01_OFFLINE.zip
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Install Chromium and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Independent 375/390 scripted tasks
        run: |
          node scripts/verify_rc2_uat_user_01_autonomous.cjs
          node scripts/verify_rc2_visual_uat_01_tasks.cjs
      - name: Attach review evidence on success or failure (NO DEPLOY)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-uat-user-01-independent-scripted-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            release-evidence/rc2-uat-user-01/
            release-evidence/rc2-visual-uat-01/results.json
            release-evidence/rc2-merge-prep-10/build-summary.json
