name: NAV VIS UNIFY 01B - current four SVG candidate and H01 label trial
on:
  push:
    branches: [isolate/nav-vis-unify-01b-20261112]
    paths:
      - .github/workflows/nav-vis-unify-01b.yml
      - scripts/verify_nav_vis_unify_01b_browser.cjs
      - docs/NAV_VIS_UNIFY_01B_20261112.md
      - app/assets/nav/current-four-01b/svg/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nav-vis-unify-01b-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Freeze original app and allow exactly eight candidate assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'isolate/nav-vis-unify-01b-20261112'
          git diff --name-only c237e0eabe1c6d2da3e929598dc924c979031c53 HEAD -- app/ | sort >/tmp/nav-01b-actual
          printf '%s\n' \
            app/assets/nav/current-four-01b/svg/calendar-active.svg \
            app/assets/nav/current-four-01b/svg/calendar-inactive.svg \
            app/assets/nav/current-four-01b/svg/home-active.svg \
            app/assets/nav/current-four-01b/svg/home-inactive.svg \
            app/assets/nav/current-four-01b/svg/mine-active.svg \
            app/assets/nav/current-four-01b/svg/mine-inactive.svg \
            app/assets/nav/current-four-01b/svg/stores-active.svg \
            app/assets/nav/current-four-01b/svg/stores-inactive.svg >/tmp/nav-01b-expected
          diff -u /tmp/nav-01b-expected /tmp/nav-01b-actual
          d=app/prototype/parallel/core-journey-fix-01/demo
          test "$(git hash-object "$d/h01-state-impl-01.js")" = ed1a5369aaa4dbc415aa62390107c91a732d2fe2
          test "$(git hash-object "$d/h01-state-impl-01.css")" = 713c418185549bd888e02d918e0723c2c12247d8
          grep -Fq 'nav_original_${suffix}.png' "$d/home-bridge.js"
          grep -Fq 'vis07-nav-${icon}.png' "$d/app.js"
          grep -Fq "'navBooking','预约订单','calendar'" "$d/app.js"
          ! grep -Eq 'h01FlowContext|h01StageProgress|h01SceneImage' "$d/h01-state-impl-01.js"
          for f in app/assets/nav/current-four-01b/svg/*.svg; do
            grep -Fq 'viewBox="0 0 24 24"' "$f"
            grep -Fq '<title>' "$f"
          done
          node --check scripts/verify_nav_vis_unify_01b_browser.cjs
  browser-design-candidate:
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Build sole-source isolated HTML prototype
        env:
          RC2_BUNDLE_BRANCH: ${{ github.ref_name }}
          RC2_BUNDLE_SOURCE_PR: '156'
          RC2_BUNDLE_BASE_PR: '156'
          RC2_BUNDLE_LABEL: NAV-VIS-UNIFY-01B-EDITABLE-CANDIDATE
          RC2_BUNDLE_ARCHIVE: MiniKoala_NAV_VIS_UNIFY_01B.zip
        run: python3 scripts/build_rc2_isolated_demo.py
      - name: Confirm same SHA bundle and legal state source
        run: |
          node -e "const m=require('./release-evidence/rc2-merge-prep-10/site/rc2-uat-version.json');if(m.source_sha!==process.env.GITHUB_SHA||m.source_branch!==process.env.GITHUB_REF_NAME||m.source_pr!==156)throw Error('NAV01B_SOURCE_MISMATCH');console.log(m)"
      - name: Install Chinese fonts and headless Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: H01 label visual trial and S01 M01 icon dual-state before-after screenshots
        run: node scripts/verify_nav_vis_unify_01b_browser.cjs
      - name: H01 protected twenty states across 375 and 390
        env:
          RC2_EXPECT_SHA: ${{ github.sha }}
          RC2_EXPECT_BRANCH: ${{ github.ref_name }}
          RC2_EXPECT_SOURCE_PR: '156'
          H01_BROWSER_CHANNEL: chromium
        run: node scripts/verify_rc2_single_candidate_03_h01_browser.cjs
      - name: Archive candidates only without rollout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NAV-VIS-UNIFY-01B-CANDIDATE-375-390
          retention-days: 7
          if-no-files-found: warn
          path: |
            app/assets/nav/current-four-01b/svg/
            release-evidence/nav-vis-unify-01b/
            release-evidence/rc2-single-candidate-03-h01/
            release-evidence/rc2-merge-prep-10/site/rc2-uat-version.json
