name: PROTO-RULE-RESTORE-04 legacy routes and visual QA
on:
  push:
    branches:
      - isolate/proto-rule-restore-04-legacy-u01-and-audit-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert no syntax changes to transaction-state engine
        run: |
          node --check app/prototype/parallel/core-journey-fix-01/demo/app.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/phone-auth.js
          node --check app/prototype/parallel/core-journey-fix-01/demo/br04/bridge.js
          node --check scripts/verify_proto_rule_restore_04.cjs
          node --check scripts/verify_proto_rule_restore_04_browser.cjs
          python3 -m py_compile scripts/build_rc2_isolated_demo.py
          node scripts/verify_proto_rule_restore_03.cjs
  full-replay:
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install playwright and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build isolated site with U01 redirects, never deploy
        env:
          RC2_BUNDLE_LABEL: PROTO-RULE-RESTORE-04-ISOLATED-20261103
          RC2_BUNDLE_ARCHIVE: MiniKoala_PROTO_RULE_RESTORE_04_20261103.zip
          RC2_BUNDLE_BRANCH: isolate/proto-rule-restore-04-legacy-u01-and-audit-20261103
        run: |
          python3 scripts/build_rc2_isolated_demo.py
          node scripts/verify_proto_rule_restore_04.cjs
      - name: Three-filter S01 packaged 375/390
        run: node scripts/verify_rc2_merge_prep_09_bundle_browser.cjs
      - name: Historical U01/route isolation and S5 double map 375/390
        run: node scripts/verify_proto_rule_restore_04_browser.cjs
      - name: Complete core chain and lifecycle smoke on both sizes
        run: node scripts/verify_rc2_rule_fix_01d_browser.cjs
      - name: Upload evidence, screenshots and isolated ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proto-rule-restore-04-private-proof-375-390
          path: |
            release-evidence/rule-restore-04/
            release-evidence/rc2-merge-prep-10/build-summary.json
            release-evidence/rc2-merge-prep-10/isolated-bundle-smoke.json
            release-evidence/rc2-merge-prep-10/isolated-S01-distance-*.png
            release-evidence/rc2-merge-prep-10/MiniKoala_PROTO_RULE_RESTORE_04_20261103.zip
            release-evidence/rc2-fix-01d/summary.json
          if-no-files-found: warn
          retention-days: 14
