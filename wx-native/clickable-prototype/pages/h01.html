<div class="screen" id="screen">
  <div class="hero-wrap" style="position:relative">
    <div class="statusbar overlay"><span>9:41</span><span class="sig">●●●● <i></i></span></div>
    <header class="topbar home" aria-label="城市与搜索">
      <button class="city" data-action="city"><svg class="ico sm"><use href="#i-pin"/></svg><span id="city">北京</span><svg class="ico xs"><use href="#i-down"/></svg></button>
      <button class="search" data-action="search" aria-label="搜索门店、商圈或区域"><svg class="ico sm"><use href="#i-search"/></svg><span>搜索门店、商圈或区域</span></button>
      <button class="bell" data-action="messages" aria-label="消息"><svg class="ico"><use href="#i-bell"/></svg></button>
    </header>
    <section class="hero" aria-label="首页品牌区">
      <img src="../assets/store-curated/v1/SIM_BJ03/hero.webp" alt="迷你考拉仓门店走廊">
      <h1 class="slogan">让城市生活更轻松<small>家具、行李、闲置物品，找到附近适合的存储空间</small></h1>
    </section>
  </div>

  <section class="sec" id="slot-demand" aria-label="当前任务" hidden></section>

  <!-- 双任务卡：standard / weak-row -->
  <section id="tasks-std" aria-label="双任务入口" style="margin-top:16px">
    <div class="tasks">
      <a class="card float task" href="#S01" data-action="nearby"><div><div class="t">找附近门店</div><div class="s">查看门店与仓位</div><div class="a">查看门店 ›</div></div><img src="../assets/task-map.webp" alt=""></a>
      <a class="card float task" href="#CAP" data-action="estimate"><div><div class="t">估大小算价格</div><div class="s" id="task-est-sub">不知道租多大？</div><div class="a">开始估算 ›</div></div><img src="../assets/task-calculator.webp" alt=""></a>
    </div>
  </section>
  <section id="tasks-weak" aria-label="双任务入口" style="margin-top:16px" hidden>
    <div class="taskrow"><a href="#S01" data-action="nearby"><svg class="ico"><use href="#i-store"/></svg>找附近门店</a><a href="#CAP" data-action="estimate"><svg class="ico"><use href="#i-calc"/></svg>估大小算价格</a></div>
  </section>

  <!-- 为您推荐：横滑 2 张完整 + 第 3 张 25%；pending 折叠；在租/入仓前隐藏 -->
  <section id="rec" aria-label="推荐门店" style="margin-top:24px">
    <div class="sh"><h2>为您推荐</h2><a href="#S01" data-action="nearby">查看全部门店 ›</a></div>
    <div class="hscroll" id="rec-rail"></div>
    
  </section>
  <section id="rec-collapsed" aria-label="推荐门店（已收起）" style="margin-top:24px" hidden>
    <div class="rec-collapsed"><h2>为您推荐</h2><button type="button" aria-expanded="false">展开<svg class="ico sm"><use href="#i-down"/></svg></button></div>
  </section>

  <!-- 常见存储场景（文案冻结：home.html 六场景；图 = 现有 scenes/*.webp，G-02 路线 A） -->
  <section id="scenes" aria-label="常见存储场景" style="margin-top:24px">
    <div class="sh"><h2>常见存储场景</h2></div>
    <div class="scenes">
      <a class="scene" href="#CAP"><div class="pic"><img src="../assets/scenes/moving.webp" alt=""></div><span>搬家过渡</span></a>
      <a class="scene" href="#CAP"><div class="pic"><img src="../assets/scenes/renovation.webp" alt=""></div><span>装修暂存</span></a>
      <a class="scene" href="#CAP"><div class="pic"><img src="../assets/scenes/luggage.webp" alt=""></div><span>行李寄存</span></a>
      <a class="scene" href="#CAP"><div class="pic"><img src="../assets/scenes/seasonal.webp" alt=""></div><span>换季收纳</span></a>
      <a class="scene" href="#CAP"><div class="pic"><img src="../assets/scenes/collection.webp" alt=""></div><span>兴趣收藏</span></a>
      <a class="scene" href="#CAP"><div class="pic"><img src="../assets/scenes/household.webp" alt=""></div><span>闲置物品</span></a>
    </div>
  </section>

  <!-- 企业横幅：白卡 + 浅绿角标，无大色块（D-30） -->

    <a class="card ent" href="#BUSINESS"><div class="ic"><svg class="ico"><use href="#i-building"/></svg></div><div class="body"><div class="t">企业存储<span class="badge">企业</span></div><div class="s">灵活空间，满足商家备货与企业存储需求</div></div><span class="a">了解企业存储 ›</span></a>
  </section>

  <!-- 品牌区：Logo + 经营数据 + 四支柱 + 资质（口径 D-05 原样沿用；考拉 IP 不出场 D-31） -->
  <section class="brand" aria-label="品牌信任" style="margin-top:24px">
    <div class="logo"><i></i>迷你考拉仓</div>
    <div class="metrics"><div><b>14<small>年</small></b><span>稳定运营</span></div><div><b>590+</b><span>直营门店</span></div><div><b>30<small>万+</small></b><span>累计服务用户</span></div></div>
    <a class="btn text sm" href="acc.html?view=brand" style="margin:4px auto 0">了解迷你考拉仓 ›</a>
    
  </section>
