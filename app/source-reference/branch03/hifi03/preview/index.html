<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRANCH-03 HIFI-03 集成演示</title><style>body{margin:0;font-family:system-ui,'Microsoft Yahei',sans-serif;background:#edf5f6;color:#19384b}.layout{max-width:1050px;margin:20px auto;display:flex;gap:28px;align-items:flex-start;padding:0 15px}.phone{width:390px;height:844px;flex:none;border:5px solid #163539;border-radius:32px;overflow:hidden;background:#fff}.panel{flex:1;min-width:300px}button{padding:8px 12px;margin:5px;border:1px solid #92bcb7;border-radius:7px;background:#fff;cursor:pointer}pre{background:#fff;padding:15px;max-height:400px;overflow:auto;border-radius:8px;font-size:12px;white-space:pre-wrap}p{line-height:1.65}@media(max-width:750px){.layout{flex-direction:column;align-items:center}.panel{width:min(100%,390px)}.phone{width:min(96vw,390px);height:844px}}</style></head><body><div class="layout"><section><div id="store-app" class="phone"></div></section><aside class="panel"><h2>BRANCH-03 · 中央接线预览</h2><p>隔离挂载，未触及中央原型。示例从无需求开始，用户确认租期后才提供整期价格。此页可验证消息桥，不代表已完成中央路由。</p><button id="demand">导入 CAP 需求（未确认租期）</button><button id="confirmed">导入 S5 已确认需求</button><button id="store">打开静安店 S02</button><button id="list">返回 S01</button><button id="state">查看状态</button><pre id="log">等待模块…</pre></aside></div><script src="../module/branch03-module.js"></script><script>
const log=document.querySelector('#log');function show(s){log.textContent=JSON.stringify(s,null,2)};
const module03=MiniKoalaBranch03.mount('#store-app',{baseUrl:'../isolated/',requirement:null,onOrderIntent:intent=>show({event:'ORDER_INTENT',intent}),onBookingIntent:intent=>show({event:'BOOKING_INTENT',intent}),onNavigationRequest:r=>show({event:'NAV_REQUEST',r})});
module03.subscribe(evt=>{if(evt.kind==='READY')show(evt)});
document.querySelector('#demand').onclick=()=>module03.setRequirement({capacityM3:3.5,source:'CAP',rentalMonths:12,termConfirmed:false});
document.querySelector('#confirmed').onclick=()=>module03.setRequirement({capacityM3:3.5,source:'S5',rentalMonths:12,termConfirmed:true,quoteSnapshotRef:'demo-quote-ref-1'});
document.querySelector('#store').onclick=()=>module03.openS02('jingan');document.querySelector('#list').onclick=()=>module03.openS01();document.querySelector('#state').onclick=async()=>show(await module03.getState());
</script></body></html>
