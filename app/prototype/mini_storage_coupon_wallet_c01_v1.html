<!doctype html><html lang="zh-CN" class="vis-bg01" data-vis-page="WALLET"><head>
<style data-vis-bg01-order>@layer vis-bg01;</style><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>C01 我的优惠券</title><link rel="stylesheet" href="mini_storage_coupon_benefit_v1.css"><script src="mini_storage_coupon_benefit_v1.js"></script><link rel="stylesheet" href="mk-v3-site-shell-rollout.css" data-ui-system="v3-site-shell"><link rel="stylesheet" href="mk-uxc-scrollbar-hide.css" data-ui-system="ux-patch-c"/>

<link rel="stylesheet" href="mk-uxd2-layout-actions.css" data-ux-patch="d2-layout-actions">
<link rel="stylesheet" href="vis_bg01_background_unification.css" data-ui-system="vis-bg01">
</head><body class="koala-uxd2-layout coupon-page koala-site-shell" data-ux-patch-d2="v1"><div class="coupon-phone"><div class="coupon-top"><button class="coupon-back" id="back">‹</button><h1>我的优惠券</h1><div></div></div><main class="coupon-main"><div class="coupon-summary"><b id="summaryTitle">我的优惠</b><span id="summaryDesc">优惠券会在符合条件的仓位方案中自动匹配使用。</span></div><div class="coupon-tabs"><button class="coupon-tab active" data-tab="usable">可使用</button><button class="coupon-tab" data-tab="used">已使用</button><button class="coupon-tab" data-tab="expired">已失效</button></div><div id="list"></div></main></div><script>
const API=window.MINI_KOALA_COUPON_V1;API.ensureAcquisitionWallet();let tab=API.wallet().some(x=>API.effectiveStatus(x)==='REDEEMED')?'used':'usable';const list=document.querySelector('#list');
function formatDate(v){if(!v)return '—';const d=new Date(v);return `${d.getMonth()+1}月${d.getDate()}日`}
function detail(t){if(t.coupon_type==='RENT_CASH')return t.coupon_id==='CPN-002'?'租满12个月可用':'首次租仓 · 整期租金满¥2,000可用';if(t.coupon_type==='SERVICE_BENEFIT')return '符合搬运服务条件时使用，不抵扣仓位租金';if(t.coupon_type==='RENEWAL_CASH')return '续租满6个月可用';return ''}
function render(){const rows=API.wallet().map(x=>({...x,template:API.TEMPLATES[x.coupon_id]})).map(x=>({...x,status:API.effectiveStatus(x)})).filter(x=>tab==='usable'?x.status==='CLAIMED':tab==='used'?x.status==='REDEEMED':['EXPIRED','INVALID','REVOKED'].includes(x.status));document.querySelector('#summaryTitle').textContent=tab==='usable'?`可查看 ${rows.length} 张优惠`:tab==='used'?'已使用优惠':'已失效优惠';list.innerHTML=rows.length?rows.map(x=>`<div class="coupon-card"><div class="coupon-card-top"><div><div class="coupon-card-value">${x.template.coupon_type==='SERVICE_BENEFIT'?'¥'+x.template.face_value+'<small>搬运补贴</small>':'¥'+x.template.face_value}</div><div class="coupon-card-name">${x.template.coupon_name}</div></div></div><div class="coupon-card-desc">${detail(x.template)}</div><div class="coupon-card-foot"><span>有效期至 ${formatDate(x.expire_time)}</span>${tab==='usable'&&x.template.coupon_type==='RENT_CASH'?'<button class="coupon-action" data-use="1">去使用</button>':''}</div></div>`).join(''):'<div class="coupon-empty">当前没有这一状态的优惠券。</div>';list.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>location.href='mini_storage_coupon_select_c02_v1.html')}
document.querySelectorAll('.coupon-tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.coupon-tab').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelector('#back').onclick=()=>history.length>1?history.back():location.href='mini_storage_mine_m01_v1_11_self_service_Visual_V2_7_4.html';document.querySelectorAll('.coupon-tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));document.querySelectorAll('.coupon-tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));render();
</script><script src="mini_storage_global_support_v274.js"></script></body></html>
