</head><body class="koala-uxd2-layout koala-site-shell koala-vis06c-life koala-life-core" data-ux-patch-d2="v1"><div class="phone"><div class="top"><button class="back" id="back">‹</button><h1>发票</h1><div aria-label="微信小程序系统操作区占位" class="wx-capsule-space"><span class="dot">•••</span><span class="divider"></span><span class="circle"></span></div></div><div class="content"><div class="card"><span class="badge">发票</span><h2>申请与查看发票</h2><div class="muted">开票金额基于实际已支付交易记录，不使用重新计算金额。</div></div><div id="paymentList"></div><div class="card" id="formCard"><h3>发票信息</h3><div class="field"><label>选择付款记录</label><select id="paymentSelect"></select></div><div class="field"><label>发票类型</label><select id="invoiceType"><option value="PERSONAL">个人</option><option value="COMPANY">企业</option></select></div><div class="field"><label>抬头</label><input id="titleInput" placeholder="请输入发票抬头"></div><div class="field" id="taxField" style="display:none"><label>纳税人识别号</label><input id="taxId" placeholder="企业开票时填写"></div><div class="field"><label>接收邮箱</label><input id="email" type="email" placeholder="用于接收电子发票"></div><button class="btn primary" id="submitInvoice" style="width:100%">提交开票申请</button><div class="notice" style="margin-top:10px">当前不承诺具体开票时效；提交后保留申请状态供后续查询。</div></div><div class="card"><h3>已提交申请</h3><div id="invoiceList" class="muted"></div></div></div><div class="toast" id="toast"></div></div><script src="mini_storage_business_ssot_v274.js"></script><script>const p=new URLSearchParams(location.search),REPO=window.MINI_STORAGE_REPO_V242,LIFE=window.MINI_STORAGE_LIFECYCLE_V242,MASTER=window.MINI_STORAGE_MASTER_V242;const orderNo=p.get('orderNo')||REPO.getCurrent().order_no||'';let order=REPO.findOrder(orderNo)||REPO.getCurrent();function $(s){return document.querySelector(s)}function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',1600)}$('#back').onclick=()=>history.length>1?history.back():location.href='mini_storage_mine_m01_v1_11_self_service_Visual_V2_7_4.html';
function render(){const pays=REPO.getPayments().filter(x=>x.order_no===orderNo&&x.status==='PAID');if(!pays.length&&order.payment_status==='PAID'){REPO.ensureInitialPayment(order);return render()}$('#paymentSelect').innerHTML=pays.map(x=>`<option value="${x.payment_id}">${x.type==='RENEWAL'?'续租':'首次支付'} · ¥${Number(x.amount||0).toLocaleString()}</option>`).join('');$('#paymentList').innerHTML=pays.map(x=>`<div class="card"><div class="row"><span>${x.type==='RENEWAL'?'续租付款':'首次付款'}</span><b>¥${Number(x.amount||0).toLocaleString()}</b></div><div class="muted">付款记录 ${x.payment_id}</div></div>`).join('')||'<div class="empty">暂无可开票付款记录</div>';const inv=REPO.getInvoices().filter(x=>x.order_no===orderNo);$('#invoiceList').innerHTML=inv.length?inv.map(x=>`<div class="row"><span>${x.invoice_type==='COMPANY'?'企业':'个人'} · ${x.title}</span><b>${x.status==='SUBMITTED'?'已提交':x.status}</b></div><div class="muted">¥${Number(x.amount||0).toLocaleString()} · ${new Date(x.submitted_at).toLocaleString()}</div>`).join(''):'暂无已提交申请。';}$('#invoiceType').onchange=()=>$('#taxField').style.display=$('#invoiceType').value==='COMPANY'?'block':'none';$('#submitInvoice').onclick=()=>{const pay=REPO.getPayments().find(x=>x.payment_id===$('#paymentSelect').value);if(!pay){toast('暂无可开票付款记录');return}const title=$('#titleInput').value.trim();const email=$('#email').value.trim();if(!title||!email){toast('请填写抬头和接收邮箱');return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){$('#email').focus();toast('请填写有效的接收邮箱');return}if(REPO.getInvoices().some(x=>x.payment_id===pay.payment_id&&!['CANCELLED','REJECTED'].includes(x.status))){toast('这笔付款已有开票申请，请查看申请状态');return}if($('#invoiceType').value==='COMPANY'&&!$('#taxId').value.trim()){toast('企业发票请填写纳税人识别号');return}REPO.saveInvoice({order_no:orderNo,payment_id:pay.payment_id,amount:Number(pay.amount||0),invoice_type:$('#invoiceType').value,title,tax_id:$('#taxId').value.trim(),email});toast('开票申请已提交');render()};render();</script><script src="mini_storage_global_support_v274.js"></script>
