</head><body class="koala-uxd2-layout koala-site-shell koala-vis06c-life koala-life-service" data-ux-patch-d2="v1"><main class="app"><header class="head"><button class="back" id="back" aria-label="返回">‹</button><h1>看仓预约</h1><div class="capsule" aria-label="微信小程序系统操作区占位"><span>•••</span><i></i><span>○</span></div></header>
<div id="empty" class="empty hidden"><h2>暂无看仓预约</h2><p>选择门店或具体仓位后，可以预约到店查看真实空间。</p><a href="mini_storage_home_H01_Visual_V2_7_4_SSOT.html">返回首页</a></div>

<section class="card"><h3>预约信息</h3><div class="row"><span>预约时间</span><b id="time">—</b></div><div class="row"><span>门店</span><b id="store">—</b></div><div class="row" id="unitRow"><span>计划仓位</span><b id="unit">—</b></div><div class="row" id="needRow"><span>空间需求</span><b id="need">—</b></div><div class="row" id="noteRow"><span>备注</span><b id="note">—</b></div></section>
<div class="actions"><button class="primary" id="continue">继续查看仓位</button><button class="secondary" id="edit">修改预约时间</button><button class="text" id="cancel">取消预约</button></div></div></main>

<script src="../data/mini_koala_data.js"></script><script>
const KEY='mini_storage_viewing_current',MASTER=window.MINI_STORAGE_MASTER_V222,p=new URLSearchParams(location.search);let v={};try{v=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function home(){location.href='mini_storage_home_H01_Visual_V2_7_4_SSOT.html'}document.querySelector('#back').onclick=home;
if(!v.viewing_id){document.querySelector('#content').classList.add('hidden');document.querySelector('#empty').classList.remove('hidden')}else{
 const storeId=MASTER.stores[v.store_id]?v.store_id:'jianguo',isCancelled=v.status==='CANCELLED';document.querySelector('#time').textContent=[v.appointment_date||p.get('date')||'待确认',v.appointment_slot||p.get('slot')||''].filter(Boolean).join(' ');document.querySelector('#store').textContent=MASTER.stores[storeId].name;
 document.querySelector('#unitRow').classList.toggle('hidden',!(v.size_option_id||v.unit_id));document.querySelector('#unitRow span').textContent=v.size_option_id?'容量方案':'计划仓位';document.querySelector('#unit').textContent=v.size_option_id?`${Number(v.volume||v.target_volume||0).toFixed(1)}m³ · 仓号 ${v.representative_unit_no||v.unit_id||'—'}`:(v.unit_id?`仓位 ${v.unit_id}`:'—');document.querySelector('#needRow').classList.toggle('hidden',!v.target_volume);document.querySelector('#need').textContent=v.target_volume?`${Number(v.target_volume).toFixed(1)}m³${v.term_months?` · ${v.term_months}个月`:''}`:'—';document.querySelector('#noteRow').classList.toggle('hidden',!v.note);document.querySelector('#note').textContent=v.note||'—';
 if(isCancelled){document.querySelector('#statusCard').classList.add('cancelled');document.querySelector('#statusIcon').textContent='—';document.querySelector('#statusLabel').textContent='预约已取消';document.querySelector('#statusTitle').textContent='本次到店安排已取消';document.querySelector('#statusDesc').textContent='您可以继续在线查看仓位，需要时重新预约。';document.querySelector('#edit').classList.add('hidden');document.querySelector('#cancel').classList.add('hidden')}
 document.querySelector('#continue').onclick=()=>{if(v.size_option_id||v.unit_id){const q=new URLSearchParams({unit:v.representative_unit_no||v.unit_id||'',sizeOption:v.size_option_id||'',representativeUnit:v.representative_unit_no||v.unit_id||'',actualUnit:v.actual_unit_id||'',inventoryIdentity:v.unit_identity_type||(v.size_option_id?'SIZE_OPTION':'ACTUAL_UNIT'),store:storeId,fromS01State:'estimated'});if(v.target_volume)q.set('target',String(v.target_volume));if(v.term_months)q.set('term',String(v.term_months));location.href='mini_storage_unit_detail_u01_v1_21_self_service_Visual_V2_7_4.html?'+q.toString()}else{const q=new URLSearchParams({state:v.target_volume?'estimated':'browse',store:storeId,fromS01State:v.target_volume?'estimated':'browse'});if(v.target_volume)q.set('target',String(v.target_volume));if(v.term_months)q.set('term',String(v.term_months));location.href='mini_storage_store_detail_s02_v1_23_self_service_Visual_V2_7_4.html?'+q.toString()}};
 document.querySelector('#edit').onclick=()=>{const q=new URLSearchParams({edit:'1',viewingId:v.viewing_id,source:v.source_page||'S02',scope:v.viewing_scope||'STORE',store:storeId});if(v.representative_unit_no||v.unit_id)q.set('unit',v.representative_unit_no||v.unit_id);if(v.size_option_id)q.set('sizeOption',v.size_option_id);if(v.representative_unit_no)q.set('representativeUnit',v.representative_unit_no);if(v.actual_unit_id)q.set('actualUnit',v.actual_unit_id);if(v.unit_identity_type)q.set('inventoryIdentity',v.unit_identity_type);if(v.target_volume)q.set('target',String(v.target_volume));if(v.volume)q.set('volume',String(v.volume));if(v.term_months)q.set('term',String(v.term_months));if(v.current_monthly_price)q.set('monthly',String(v.current_monthly_price));location.href='mini_storage_viewing_v01_v1_14_self_service_synced.html?'+q.toString()};
 document.querySelector('#cancel').onclick=()=>{if(!confirm('取消这次看仓预约？'))return;v.status='CANCELLED';v.updated_at=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(v));location.reload()};
}
