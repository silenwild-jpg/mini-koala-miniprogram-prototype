  if(v.viewing_id && v.status==='BOOKED')html+=`<div class="asset" id="assetViewing"><div class="eyebrow">看仓预约</div><b>${fmtDate(v.appointment_date)} · ${v.appointment_slot||''}</b><p>${STORE_NAMES[v.store_id]||'门店'}${v.size_option_id?` · 容量方案 ${Number(v.volume||v.target_volume||0).toFixed(1)}m³`:v.unit_id?` · 计划看仓位 ${v.unit_id}`:''}</p><div class="go">查看预约 ›</div></div>`;

  if(!html && r.target_volume)html+=`<div class="asset" id="assetRequirement"><div class="eyebrow">继续找仓</div><b>约 ${Number(r.target_volume).toFixed(1)}m³ · ${validTerm(r.term_months)?validTerm(r.term_months)+'个月':'租期待选择'}</b><p>${validTerm(r.term_months)?'恢复上次找仓需求，不需要重新估算。':'已保存容量；继续前先选择租期，再查看正式价格。'}</p><div class="go">继续找仓 ›</div></div>`;

  document.querySelector('#assetRenewal')?.addEventListener('click',()=>location.href='mini_storage_renew_rn01_v2_7_4.html?orderNo='+encodeURIComponent(o.order_no));

  const transportBtn=document.querySelector('#myTransport');const hasTransport=orderLifecycle.is_current && o.transport_promo_status==='ELIGIBLE';transportBtn.classList.toggle('hidden',!hasTransport);if(hasTransport)document.querySelector('#transportBadge').textContent=o.transport_right_status==='REDEEMED'?'已使用':'1次单程基础运输 · 待预约';
