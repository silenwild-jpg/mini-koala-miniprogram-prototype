<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>预约用仓 · BRANCH-04 无变形适配</title><link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../adapter.css"></head>
<body data-page="reserve">
<div class="screen-viewport" id="screenViewport">
  <div class="artboard-holder" id="artboardHolder">
  <main class="artboard" id="artboard" aria-label="预约用仓高保真原型">
    <!-- Frozen source photograph, light and subject are pixel-preserved. The heading/navigation lettering was baked into supplied raster. -->
    <div class="hero-source" role="img" aria-label="母版原始仓储走廊场景示意，含标题：告诉我们您的用仓需求，专业顾问将为您推荐合适的仓位并协助确认"></div>
    <button type="button" class="hero-back-hit" aria-label="返回" id="back"></button>
    <button type="button" class="hero-menu-hit" aria-label="小程序菜单" id="menu"></button>
    <section class="form-sheet" aria-label="预约用仓表单">
      <form id="reserveForm" novalidate>
        <label class="section-title contact-title" for="booking-address">用仓地址 <span class="required">*</span></label>
        <div class="phone-line"><div class="phone-entry address-entry"><input id="booking-address" type="text" maxlength="120" autocomplete="off" required placeholder="填写用仓地址，如：城市、街道和楼栋"></div></div>
        <p class="privacy-help">填写地址即可提交；以下时间和需求信息可选。</p>
        <h2 class="section-title time-title">预计用仓时间 <span class="not-required">（可选）</span></h2>
        <div class="term-pills" role="group" aria-label="预计用仓时间">
          <button type="button" data-term="尽快" aria-pressed="false">尽快</button>
          <button type="button" data-term="1个月内" aria-pressed="false">1个月内</button>
          <button type="button" data-term="3个月内" aria-pressed="false">3个月内</button>
          <button type="button" data-term="暂不确定" aria-pressed="false">暂不确定</button>
        </div>
        <button class="date-control" id="dateBtn" type="button" aria-label="选择具体日期"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7.5 2.5v5M16.5 2.5v5M3 10h18M8 14h2M13 14h2"/></svg><span id="dateText">选择日期</span><span class="chevron">›</span></button>
        <input id="dateInput" type="date" class="date-input" aria-label="预计用仓日期">

        <h2 class="section-title request-title">用仓需求 <span class="not-required">（可选）</span></h2>
        <div class="option-list">
          <button type="button" class="option" data-choice="items"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3"/><path d="M5.2 20v-2.6c0-3.2 2.8-5.1 6.8-5.1s6.8 1.9 6.8 5.1V20z"/></svg><span>存放物品</span><span class="option-value" id="itemsValue">请选择</span><span class="right-arrow">›</span></button>
          <button type="button" class="option" data-choice="capacity"><svg viewBox="0 0 24 24"><path d="M4.5 7.3 12 3l7.5 4.3V17L12 21l-7.5-4zM4.5 7.3 12 12l7.5-4.7M12 12v9"/></svg><span>意向容量</span><span class="option-value" id="capacityValue">请选择</span><span class="right-arrow">›</span></button>
          <button type="button" class="option" data-choice="duration"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M7.5 2.5v5M16.5 2.5v5M3.5 10h17M8 14h2M13 14h2"/></svg><span>预计租期</span><span class="option-value" id="durationValue">请选择</span><span class="right-arrow">›</span></button>
        </div>
        <div class="note-field"><label for="note"><svg viewBox="0 0 24 24"><path d="M5 5h14M5 11.5h14M5 18h14M5 5v4M19 14v4"/></svg>其他需求或备注</label><textarea id="note" maxlength="200" placeholder="例如：搬运需求、特殊物品、预算范围等..."></textarea><span id="counter">0/200</span></div>
        <button type="submit" class="submit" id="submit">提交用仓需求</button>
        <p class="under-submit">提交后将由我们的顾问尽快与您联系，暂不产生订单</p>
      </form>
      <section class="success-state" id="success" hidden aria-live="polite"><span class="ok">✓</span><h2>用仓需求已记录</h2><p>用仓地址和需求信息已保存。</p><button type="button" id="again">返回填写页面</button></section>
    </section>
    <div class="selection-mask" id="selectionMask" hidden><div class="selection-popup"><div class="popup-head"><b id="popupTitle">请选择</b><button type="button" id="closePopup" aria-label="关闭">×</button></div><div class="popup-options" id="popupOptions"></div></div></div>
    <div role="status" class="toast" id="toast" hidden></div>
    <!-- Optional semantic DOM headings correspond to the original baked typography; source art remains visually unchanged. -->
    <div class="semantic-title" aria-hidden="true" data-editable-source="hero-text">告诉我们您的用仓需求</div>
  </main>
  </div>
</div>

<script src="../bridge.js?v=VA04"></script></body></html>
