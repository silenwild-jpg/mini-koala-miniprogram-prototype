<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f9f5"><title>BRANCH-04 · 快捷下单｜母版高保真还原</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../adapter.css"></head><body data-page="quick">

<div class="app"><div class="page-scroll" id="page-scroll"><header class="hero"><div class="iosbar"><strong>9:41</strong><div class="ios-icons"><span class="cellular"><i></i><i></i><i></i><i></i></span><svg class="wifi" viewBox="0 0 24 24"><path d="M2 8c6-5 14-5 20 0M5 12c4-3 10-3 14 0M9 16c2-1.5 4-1.5 6 0"/><circle cx="12" cy="20" r="1.1" fill="currentColor" stroke="none"/></svg><span class="battery"><i></i></span></div></div><nav class="nav"><button type="button" class="back hit" id="back-button" aria-label="返回"><svg><use href="#i-back"/></svg></button><h1>快捷下单</h1><button type="button" class="menu" aria-label="微信小程序菜单" id="menu-button"><span>•••</span><span class="ring">●</span></button></nav><div class="progress" aria-label="流程：选择信息，确认订单，支付"><span class="progitem active"><b>1</b>选择信息</span><i></i><span class="progitem"><b>2</b>确认订单</span><i></i><span class="progitem"><b>3</b>支付</span></div></header>
<main class="flow">
<section class="panel store-panel" aria-label="选择门店"><h2><span class="section-icon"><svg><use href="#i-pin"/></svg></span>选择门店</h2><div class="place-line"><svg><use href="#i-pin"/></svg><strong id="city-text">深圳 · 宝安区</strong><button type="button" class="text-link" data-choice="city">切换 <svg><use href="#i-forward"/></svg></button></div><div class="store-row"><img src="assets/store-photo.png" alt="宝安中心店门店场景示意"/><div class="store-copy"><div class="store-name"><b id="store-name">宝安中心店</b><span class="distance"><svg><use href="#i-pin"/></svg><span id="distance-value">1.2km</span></span></div><div class="store-address" id="store-address">宝安区新安街道兴业路88号</div><button type="button" class="store-detail" id="store-detail">查看详情 <svg><use href="#i-forward"/></svg></button></div><button type="button" class="icon-link" data-choice="store" aria-label="更换门店"><svg><use href="#i-forward"/></svg></button></div></section>
<section class="panel unit-panel" aria-label="选择仓位"><h2><span class="section-icon"><svg><use href="#i-box"/></svg></span>选择仓位</h2><div class="unit-row"><img src="assets/unit-photo.png" alt="B12仓位场景示意"/><div class="unit-copy"><div class="unit-head"><b id="unit-name">B12 仓</b><button type="button" class="swap" data-choice="unit">更换</button></div><strong class="capacity" id="capacity-value">5.2m³</strong><div class="badges"><span>独立仓位</span><span>实体门</span><span>干净顶板</span></div><div class="unit-money"><strong class="money" id="unit-price">—</strong><span class="money-term" id="price-term"></span><span class="money-monthly" id="monthly-note"></span></div></div></div></section>
<section class="panel term-panel" aria-label="选择租期"><h2><span class="section-icon"><svg><use href="#i-wallet"/></svg></span>选择租期</h2><div class="term-row" id="term-row"><button type="button" data-term="1" aria-pressed="false">1个月</button><button type="button" data-term="3" aria-pressed="false">3个月</button><button type="button" data-term="6" aria-pressed="false">6个月</button><button type="button" data-term="12" class="recommended" aria-pressed="false"><em>推荐</em>12个月</button><button type="button" id="more-terms">更多 <small>⌄</small></button></div></section>
<section class="panel date-panel" aria-label="预计用仓时间"><h2><span class="section-icon"><svg><use href="#i-calendar"/></svg></span>预计用仓时间</h2><label class="date-box" for="start-date"><svg><use href="#i-calendar"/></svg><span id="date-label">请选择用仓日期</span><svg class="arrow"><use href="#i-forward"/></svg><input type="date" id="start-date" aria-label="选择预计用仓日期"></label></section>
<section class="estimate-panel" aria-label="预计费用"><div class="estimate-heading">预计费用 <span>（整期）</span></div><div class="estimate-content"><div class="estimate-money"><span class="amount" id="estimate-amount">选择租期后显示</span><span id="estimate-months"></span><small id="estimate-monthly"></small></div><button type="button" class="fee-detail" id="fee-detail">费用明细 <svg><use href="#i-forward"/></svg></button></div><div class="estimate-note">✔ 品牌保障 · 安全可靠 · 24小时存取</div></section>
</main></div>
<div class="bottom"><button type="button" class="next-button" id="next-button">下一步：确认订单</button></div>
