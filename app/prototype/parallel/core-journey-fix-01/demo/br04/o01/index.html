<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>迷你考拉仓 · 确认订单</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="../adapter.css"></head>
<body data-page="o01">
<div class="mobile" id="app">
  <main class="scrollpane" id="scrollpane">
    <header class="top">
      <div class="status"><b>9:41</b><div class="sys-icons"><span class="bars"><i></i><i></i><i></i><i></i></span><svg width="19" height="15" viewBox="0 0 22 19" fill="none"><path d="M2 6 Q11 -2 20 6 M5 10 Q11 5 17 10 M9 14 Q11 12 13 14" stroke="currentColor" stroke-linecap="round" stroke-width="2.5"/><circle cx="11" cy="17" r="1.5" fill="currentColor"/></svg><span class="battery"><span></span></span></div></div>
      <nav class="nav"><button id="back" aria-label="返回上一步" class="back"><svg viewBox="0 0 24 24"><path d="m14 4-8 8 8 8"/></svg></button><h1>确认订单</h1><div class="mini-pill" aria-label="微信小程序菜单" role="presentation"><b>•••</b><span class="mini-circle"><i></i></span></div></nav>
    </header>
    <div class="content">
      <section class="card summary" aria-label="订单仓位信息">
        <div class="store-line"><img src="assets/store-front.jpg" class="store-img" alt="考拉仓门店建筑实景"><div class="store-meta"><div class="name-distance"><b id="store-name">宝安中心店</b><span class="distance"><svg viewBox="0 0 20 20"><path d="M10 18s6-6.5 6-11a6 6 0 0 0-12 0c0 4.5 6 11 6 11Z"/><circle cx="10" cy="7.1" r="2.1"/></svg>1.2km</span></div><p id="store-address">宝安区新安街道xx路88号</p></div></div>
        <div class="rule"></div>
        <div class="unit-line"><img src="assets/unit-corridor.jpg" class="unit-img" alt="室内独立仓位绿色平开门实景"><div class="unit-meta"><b id="unit-name">B12 仓</b><div class="capacity">5.2m³</div><div class="tags"><span>独立仓位</span><span>实体门</span><span>干净顶板</span></div></div></div>
        <div class="rule summary-rule"></div>
        <div class="info-pair"><span>租期</span><button type="button" class="value-button" id="period">请选择租期</button></div>
        <div class="info-pair last"><span>预计用仓时间</span><input type="date" class="value-date" id="start-date" aria-label="用仓开始日期"></div>
      </section>

      <section class="card contact" aria-labelledby="contact-heading"><div class="section-title" id="contact-heading"><span class="icon-bubble"><svg viewBox="0 0 24 24"><path d="M12 2.7 20 6v5.2c0 5.1-3.4 8.7-8 10.1-4.6-1.4-8-5-8-10.1V6Z"/><path d="m8 12 2.5 2.4 5.1-5.3"/></svg></span>联系方式</div><div class="contact-row"><span id="phone">+86 · 未授权</span><button type="button" class="link" data-open="phone">更换</button></div></section>

      <section class="card charges" aria-labelledby="fee-heading"><div class="section-title" id="fee-heading"><span class="icon-bubble coin"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 8v8M9.8 10.5c2-1.5 5-.8 4.5 1.2-.5 1.9-4.8.6-4.4 2.7"/></svg></span>费用明细</div>
        <div class="fee-row"><span>整期租金（<span id="months-label">12</span>个月）</span><b id="rent">—</b></div>
        <div class="fee-row discount-row"><span>优惠减免 <button class="discount-tags" data-open="coupon" aria-label="查看或更换优惠"><em>考拉有礼</em><em>代金券</em></button></span><b class="minus" id="discount">—</b></div>
        <div class="fee-row"><span>押金（1个月月租）</span><b id="deposit">—</b></div>
        <div class="fee-row"><span>管理费</span><b id="service-fee">—</b></div>
        <div class="total"><strong>本次应付总额</strong><b id="total">—</b></div>
      </section>
      <label class="agreement"><input type="checkbox" id="agreed"><span class="check-custom" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m3.5 10 4.5 4.5L16.5 6"/></svg></span><span>我已阅读并同意 <a href="#" data-legal="仓储服务协议">《仓储服务协议》</a> <a href="#" data-legal="用户隐私政策">《用户隐私政策》</a></span></label>
      <p class="payment-note">本次不会实际扣款或锁定仓位</p>
      <div class="bottom-clearance"></div>
    </div>
  </main>
  <footer class="footer"><button class="pay-btn" id="pay">确认订单&nbsp; <span id="pay-amount">—</span></button></footer>
  <div class="scrim" id="scrim" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-heading"><h2 id="sheet-title">操作</h2><button id="close-sheet" aria-label="关闭">×</button></div><div id="sheet-content"></div></section></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<script src="../bridge.js?v=VA04"></script></body></html>
