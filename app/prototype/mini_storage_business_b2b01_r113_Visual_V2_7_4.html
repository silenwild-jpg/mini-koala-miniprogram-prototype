<script>
const EST='space_decision_assistant_v4_5_23_self_service_synced_Visual_V2_7_4.html';
const state={size:10,term:12,types:new Set(['库存']),move:'待确认',location:'北京市朝阳区建国门外大街',pickupKm:6.2};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const QUICK_TERMS=[1,3,6,12,24,36,60];
function clampTerm(v){return Math.max(1,Math.min(60,Math.round(Number(v)||1)))}
function termHuman(m){m=clampTerm(m);if(m<12)return `${m}个月`;const y=Math.floor(m/12),mo=m%12;return mo?`${m}个月（${y}年${mo}个月）`:`${y}年`}
function syncTermUI(writeInput=true){$$('#termChips .chip').forEach(x=>x.classList.toggle('active',Number(x.dataset.term)===state.term));$('#termCustom').classList.toggle('custom-active',!QUICK_TERMS.includes(state.term));if(writeInput)$('#termInput').value=state.term;$('#termHuman').textContent=`${termHuman(state.term)} · ${discountLabel(state.term)}`}
function toastMsg(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(()=>el.style.display='none',1600)}
function pick(group,el){group.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
function bandLabel(v){if(v<=5)return'1–5m³';if(v<=15)return'5–15m³';if(v<=30)return'15–30m³';return'30m³+'}
function discountLabel(term){const factor=window.MINI_STORAGE_BUSINESS_HELPERS_V274.termFactor(term);return `${Math.round(factor*100)/10}折`}
function refresh(){
  const units=window.MINI_KOALA_DATA.getLegacyUnits('jianguo');
  const unit=[...units].sort((a,b)=>Math.abs(a.v-state.size)-Math.abs(b.v-state.size)||a.base-b.base)[0];
  const monthly=window.MINI_STORAGE_BUSINESS_HELPERS_V274.monthlyReference(unit.base,state.term,'jianguo');
  const eligible=state.move==='需要'&&state.term>6&&state.pickupKm>5;
  $('#transportGift').classList.toggle('show',eligible);
}
$('#back').onclick=()=>window.MINI_KOALA_NAV.safeBack('mini_storage_home_H01_Visual_V2_7_4_SSOT.html');
$('#location').onclick=()=>{const near=state.location.includes('建国门外');state.location=near?'北京市朝阳区双井路':'北京市朝阳区建国门外大街';state.pickupKm=near?3.2:6.2;$('#locationText').textContent=state.location;refresh();toastMsg('演示：已修改用仓位置')};
$('#sizeChips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;pick($('#sizeChips'),b);if(b.dataset.size==='custom'){$('#customSize').classList.add('show');$('#sizeInput').focus()}else{$('#customSize').classList.remove('show');state.size=Number(b.dataset.size);refresh()}};
$('#sizeInput').oninput=e=>{const v=Number(e.target.value);if(v>0){state.size=v;refresh()}};
$('#termChips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;state.term=Number(b.dataset.term);syncTermUI();refresh()};
$('#termMinus').onclick=()=>{state.term=clampTerm(state.term-1);syncTermUI();refresh()};
$('#termPlus').onclick=()=>{state.term=clampTerm(state.term+1);syncTermUI();refresh()};
$('#termInput').oninput=e=>{const raw=e.target.value.trim(),n=Number(raw);if(raw&&Number.isInteger(n)&&n>=1&&n<=60){state.term=n;syncTermUI(false);refresh()}};
$('#termInput').onchange=e=>{state.term=clampTerm(e.target.value);syncTermUI();refresh()};
$('#termInput').onkeydown=e=>{if(e.key==='Enter')e.currentTarget.blur()};
$('#typeChips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const type=b.dataset.type;if(state.types.has(type)){if(state.types.size>1){state.types.delete(type);b.classList.remove('active')}}else{state.types.add(type);b.classList.add('active')}$('#otherType').classList.toggle('show',state.types.has('其他'));refresh()};
$('#moveChips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;pick($('#moveChips'),b);state.move=b.dataset.move;refresh()};
$('#estimate').onclick=()=>location.href=EST+'?scene=enterprise';
function leadPayload(){return{travel_mode:inheritedB2B.travel_mode||'drive',contact_name:$('#contactName').value.trim(),company:$('#company').value.trim(),phone:$('#phone').value.trim(),location:state.location,target_volume:Number(state.size||10),term_months:state.term,storage_types:[...state.types],storage_type_other:$('#otherTypeInput').value.trim(),moving_support:state.move,pickup_to_store_drive_km:state.pickupKm,transport_eligible:null,transport_eligibility_status:state.move==='需要'?'PENDING_ORDER_CONTEXT':'NOT_REQUESTED',transport_candidate_hint:state.move==='需要'&&state.term>=6&&state.pickupKm>=5,expected_start_date:$('#expectedDate').value,notes:$('#notes').value.trim(),scene:'enterprise',customer_type:'enterprise',status:'B2B_QUICK_REQUIREMENT',created_at:new Date().toISOString()}}
$('#browse').onclick=()=>{const p=leadPayload();localStorage.setItem('mini_storage_b2b_quick_current',JSON.stringify(p));localStorage.setItem('mini_storage_requirement_current',JSON.stringify({...p,min_volume:Math.max(.5,p.target_volume*.9),max_volume:p.target_volume*1.16,source:'B2B_QUICK'}));location.href=EST+`?entry=b2b_recommend&term=${p.term_months}&customer=enterprise&source=b2b_quick`};
$('#submit').onclick=()=>{const p=leadPayload();if(!p.phone){$('#phone').focus();toastMsg('请先填写联系电话，方便顾问与您确认');return}if(!/^1[3-9]\d{9}$/.test(p.phone.replace(/\s|-/g,''))&&!/^\+[1-9]\d{7,14}$/.test(p.phone.replace(/\s|-/g,''))){$('#phone').focus();toastMsg('请填写有效手机号，国际号码请带国家区号');return}localStorage.setItem('mini_storage_b2b_lead_current',JSON.stringify({...p,status:'SALES_FOLLOWUP_DEMO'}));toastMsg('需求已保存，顾问协助流程演示已触发')};
$('#expectedDate').min=new Date().toISOString().slice(0,10);$('#expectedDate').value=$('#expectedDate').min;
// Carry the existing demand into this editable form; confirmation still happens at Browse.
let inheritedB2B={};try{inheritedB2B=JSON.parse(localStorage.getItem('mini_storage_requirement_current')||'{}')}catch(e){}
if(Number(inheritedB2B.target_volume)>0){
  state.size=Number(inheritedB2B.target_volume);
  if(Number.isInteger(Number(inheritedB2B.term_months))&&Number(inheritedB2B.term_months)>=1&&Number(inheritedB2B.term_months)<=60)state.term=Number(inheritedB2B.term_months);
  state.location=inheritedB2B.usage_location||inheritedB2B.location||state.location;$('#locationText').textContent=state.location;
  const quick=$$('#sizeChips .chip').find(b=>Number(b.dataset.size)===state.size);
  if(quick)pick($('#sizeChips'),quick);else{const custom=$('#sizeChips [data-size="custom"]');if(custom)pick($('#sizeChips'),custom);$('#customSize').classList.add('show');$('#sizeInput').value=state.size;}
  if(inheritedB2B.customer_type==='enterprise'){
    state.types=new Set(inheritedB2B.storage_types?.length?inheritedB2B.storage_types:['库存']);
    $$('#typeChips .chip').forEach(b=>b.classList.toggle('active',state.types.has(b.dataset.type)));
    $('#company').value=inheritedB2B.company||'';$('#notes').value=inheritedB2B.notes||'';
  }
}
syncTermUI();refresh();
</script><script src="mini_storage_global_support_v274.js"></script>
