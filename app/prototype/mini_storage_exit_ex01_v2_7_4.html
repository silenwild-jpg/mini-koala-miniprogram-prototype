<script src="../data/mini_koala_data.js"></script><script>const p=new URLSearchParams(location.search),REPO=window.MINI_STORAGE_REPO_V242,LIFE=window.MINI_STORAGE_LIFECYCLE_V242,MASTER=window.MINI_STORAGE_MASTER_V242;const orderNo=p.get('orderNo')||REPO.getCurrent().order_no||'';let order=REPO.findOrder(orderNo)||REPO.getCurrent();function $(s){return document.querySelector(s)}function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',1600)}$('#back').onclick=()=>history.length>1?history.back():location.href='mini_storage_mine_m01_v1_11_self_service_Visual_V2_7_4.html';
let ret=REPO.findReturn(orderNo);function fmt(v){return v?String(v).replace(/-/g,'/'):'—'}function render(){order=REPO.findOrder(orderNo)||order;const lc=LIFE.derive(order),store=MASTER.stores[order.store_id]||{};$('#orderTitle').textContent=`${store.name||'门店'} · 仓位 ${order.actual_unit_id||order.unit_id||'—'}`;$('#orderMeta').textContent=`当前租期至 ${fmt(lc.end_date)} · 押金 ¥${Number(order.deposit_amount||0).toLocaleString()}`;const today=LIFE.toISODate(new Date());$('#targetDate').min=today;if(!$('#targetDate').value)$('#targetDate').value=lc.end_date&&lc.end_date>=today?lc.end_date:today;ret=REPO.findReturn(orderNo);let html='尚未提交退租安排。';if(ret){const map={REQUESTED:'退租安排已提交',WAITING_INSPECTION:'待门店验仓',INSPECTION_PASSED:'验仓已完成，押金处理中',COMPLETED:'退租已完成'};html=`<b>${map[ret.status]||ret.status}</b><br>${ret.type==='EARLY_RETURN'?'提前退租':ret.type==='LATE_RETURN'?'到期后取物（待确认）':'到期退租'} · 计划取物 ${fmt(ret.target_return_date)}`;if(order.deposit_status){const dm={HELD:'已收取',WAITING_INSPECTION:'待验仓',REFUND_PENDING:'退款处理中',REFUNDED:'已退款'};html+=`<br>押金状态：${dm[order.deposit_status]||order.deposit_status}`;}}$('#progressBody').innerHTML=html;$('#requestCard').style.display=ret?'none':'block';$('#clearCard').style.display=ret?.status==='REQUESTED'?'block':'none';$('#reviewBox').style.display=p.get('review')==='1'&&ret?'block':'none';$('#passInspection').disabled=ret?.status!=='WAITING_INSPECTION';$('#finishRefund').disabled=order.deposit_status!=='REFUND_PENDING';}
$('#submitReturn').onclick=()=>{const lc=LIFE.derive(order);if(!['active','ending'].includes(lc.state)){toast('当前状态暂不能提交退租安排');return}const target=$('#targetDate').value;const today=LIFE.toISODate(new Date());if(!/^\d{4}-\d{2}-\d{2}$/.test(target)||!Number.isFinite(Date.parse(target+'T00:00:00'))||target<today){$('#targetDate').focus();toast('计划取物日期不能早于今天');return}const expected=target<lc.end_date?'EARLY_RETURN':target>lc.end_date?'LATE_RETURN':'NORMAL_END';if($('#returnType').value!==expected){$('#returnType').focus();toast(expected==='EARLY_RETURN'?'早于到期日请选择提前退租':expected==='LATE_RETURN'?'晚于到期日请选择到期后取物':'到期当日请选择到期退租');return}ret=REPO.saveReturn({order_no:orderNo,type:expected,target_return_date:target,status:'REQUESTED',submitted_at:new Date().toISOString()});order=REPO.updateOrder(orderNo,{return_status:'REQUESTED',return_target_date:target,deposit_status:order.deposit_status||'HELD'});toast('退租安排已提交');render()};$('#requestInspection').onclick=()=>{if(!$('#cleared').checked){toast('请先确认仓位已取空并锁好');return}ret=REPO.saveReturn({...ret,status:'WAITING_INSPECTION',cleared_at:new Date().toISOString()});order=REPO.updateOrder(orderNo,{return_status:'WAITING_INSPECTION',deposit_status:'WAITING_INSPECTION'});toast('已申请验仓');render()};$('#passInspection').onclick=()=>{if(p.get('review')!=='1'||ret?.status!=='WAITING_INSPECTION')return;ret=REPO.saveReturn({...ret,status:'INSPECTION_PASSED',inspection_completed_at:new Date().toISOString()});order=REPO.updateOrder(orderNo,{return_status:'INSPECTION_PASSED',deposit_status:'REFUND_PENDING',access_status:'CLOSED',first_access_allowed:false,lease_status:'ENDED',lifecycle_state:'ended',detail_state:'ended',actual_return_date:LIFE.toISODate(new Date())});toast('已模拟验仓完成');render()};$('#finishRefund').onclick=()=>{if(p.get('review')!=='1'||order.deposit_status!=='REFUND_PENDING')return;ret=REPO.saveReturn({...ret,status:'COMPLETED',completed_at:new Date().toISOString()});order=REPO.updateOrder(orderNo,{return_status:'COMPLETED',deposit_status:'REFUNDED',deposit_refunded_at:new Date().toISOString(),deposit_refund_amount:Number(order.deposit_amount||0)});toast('已模拟押金退款完成');render()};render();</script><script src="mini_storage_global_support_v274.js"></script>
