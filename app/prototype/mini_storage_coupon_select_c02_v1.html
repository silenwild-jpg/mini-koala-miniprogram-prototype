<!doctype html><html lang="zh-CN" class="vis-bg01" data-vis-page="C02"><head>
<style data-vis-bg01-order>@layer vis-bg01;</style><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>C02 选择优惠券</title><link rel="stylesheet" href="mini_storage_coupon_benefit_v1.css"><script src="mini_storage_coupon_benefit_v1.js"></script><style>.coupon-bottom{transform:none!important;left:0!important;right:0!important;width:100%!important;max-width:390px!important;margin-left:auto!important;margin-right:auto!important;box-sizing:border-box!important}</style><link rel="stylesheet" href="mk-v3-site-shell-rollout.css" data-ui-system="v3-site-shell"><link rel="stylesheet" href="mk-v3-core-pages-rollout.css" data-ui-system="v3-core-pages"><link rel="stylesheet" href="mk-v3-transaction-batch-b.css" data-ui-system="vis06c-batch-b"><link rel="stylesheet" href="mk-uxc-scrollbar-hide.css" data-ui-system="ux-patch-c"/>

<link rel="stylesheet" href="mk-uxd2-layout-actions.css" data-ux-patch="d2-layout-actions">
<link rel="stylesheet" href="demo_price01_b2_prepay.css" data-price-patch="demo-price-01-b2"><script src="demo_price01_b2_display.js" defer></script>
<link rel="stylesheet" href="vis_bg01_background_unification.css" data-ui-system="vis-bg01">
</head><body class="koala-uxd2-layout coupon-page koala-site-shell koala-c02" data-ux-patch-d2="v1"><div class="coupon-phone"><div class="coupon-top"><button class="coupon-back" id="back">‹</button><h1>选择优惠券</h1><div></div></div><main class="coupon-main"><div class="coupon-summary"><b id="summaryTitle">已为您选择最优优惠</b><span id="summaryDesc">系统会按当前仓位、租期和订单条件计算实际优惠金额。</span></div><div class="coupon-section-title">当前可用</div><div id="usable"></div><div class="coupon-section-title">暂不可用</div><div id="unusable"></div></main><div class="coupon-bottom"><button id="auto">自动使用最优优惠</button><button class="coupon-none" id="none" type="button">暂不使用优惠券</button></div></div><script>
const API=window.MINI_KOALA_COUPON_V1;API.ensureAcquisitionWallet();const s=API.readSnapshot();const ctx=API.couponContextFromSnapshot(s);/* H01-007-S2 D-06: same fields as before plus recover_order_no, so a coupon locked by this order shows as usable instead of 暂不可用 */const current=API.selection();
function returnBack(){let u='';try{u=localStorage.getItem('mini_koala_coupon_return_href_v1')||'';localStorage.removeItem('mini_koala_coupon_return_href_v1')}catch(e){}if(u){location.href=u;return}if(history.length>1)history.back();else location.href='mini_storage_unit_detail_u01_v1_21_self_service_Visual_V2_7_4.html'}
function card(x,usable){const t=x.template;const isSel=(current.mode==='manual'&&current.coupon_id===x.coupon_id)||(current.mode==='auto'&&API.best(ctx)?.coupon_id===x.coupon_id);return `<div class="coupon-card ${usable?'':'disabled'}"><div class="coupon-card-top"><div><div class="coupon-card-value">¥${t.face_value}</div><div class="coupon-card-name">${t.coupon_name}</div></div></div><div class="coupon-card-desc">${usable?(t.coupon_id==='CPN-002'?'租满12个月可用':'符合当前订单条件，可用于抵扣整期租金'):x.ineligible_reason}</div><div class="coupon-card-foot"><span>${usable?'当前可用':'暂不可用'}</span>${usable?`<button class="coupon-action ${isSel?'primary':''}" data-id="${x.coupon_id}">${isSel?'使用中':'使用'}</button>`:''}</div></div>`}
function render(){const all=API.entries(ctx).filter(x=>x.template&&x.template.coupon_type==='RENT_CASH');const yes=all.filter(x=>x.eligible),no=all.filter(x=>!x.eligible);document.querySelector('#usable').innerHTML=yes.length?yes.map(x=>card(x,true)).join(''):'<div class="coupon-empty">当前没有可用的租金优惠券。</div>';document.querySelector('#unusable').innerHTML=no.length?no.map(x=>card(x,false)).join(''):'<div class="coupon-empty">没有其他暂不可用优惠券。</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{API.setSelection('manual',b.dataset.id);returnBack()})}
document.querySelector('#auto').onclick=()=>{API.setSelection('auto',null);returnBack()};document.querySelector('#none').onclick=()=>{API.setSelection('none',null);returnBack()};document.querySelector('#back').onclick=returnBack;render();
</script><script src="mini_storage_global_support_v274.js"></script></body></html>
