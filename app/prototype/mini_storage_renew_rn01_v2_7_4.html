</head><body class="koala-uxd2-layout koala-site-shell koala-vis06c-life koala-life-core" data-ux-patch-d2="v1"><div class="phone"><div class="top"><button class="back" id="back">‹</button><h1>续租</h1><div aria-label="微信小程序系统操作区占位" class="wx-capsule-space"><span class="dot">•••</span><span class="divider"></span><span class="circle"></span></div></div><div class="content"><div class="card"><span class="badge" id="lifeBadge">续租</span><h2 id="orderTitle">当前仓位</h2><div class="muted" id="orderMeta"></div></div><div class="card" id="renewForm"><h3>选择续租月份</h3><div class="chips" id="monthChips"><button class="chip" data-m="1">1个月</button><button class="chip" data-m="3">3个月</button><button class="chip active" data-m="6">6个月</button><button class="chip" data-m="12">12个月</button><button class="chip" data-m="24">2年</button><button class="chip" data-m="36">3年</button><button class="chip" data-m="60">5年</button></div><div class="term-custom" id="termCustom"><div class="term-custom-label">其他租期（1–60个月任意整数月）</div><div class="term-stepper"><button aria-label="减少一个月" id="termMinus" type="button">−</button><input aria-label="直接输入租期月份" id="months" inputmode="numeric" max="60" min="1" placeholder="直接填写月份" step="1" type="number" value="6"><button aria-label="增加一个月" id="termPlus" type="button">＋</button></div><div class="term-human" id="termHuman">6个月</div></div><div class="notice">提交续租需求后不会自动扣款。续租为单独报价，租期按钮不代表固定折扣；价格确认后才会进入支付。</div><div class="actions" style="margin-top:12px"><button class="btn primary" id="submitRenew">提交续租需求</button></div></div><div class="card" id="statusCard"><h3>续租状态</h3><div class="actions" style="margin-top:12px"><button class="btn" onclick="location.href='mini_storage_home_H01_Visual_V2_7_4_SSOT.html'">返回首页</button><button class="btn" onclick="location.href='mini_storage_order_o03_v1_17_self_service_Visual_V2_7_4.html?orderNo='+encodeURIComponent(new URLSearchParams(location.search).get('orderNo')||'')">查看订单</button></div><div id="statusBody" class="muted">尚未提交续租需求。</div></div><div class="review" id="reviewBox" style="display:none"><b>内部演示控制</b><div class="field"><label>手工输入演示月租（元/月）</label><input id="reviewMonthly" type="number" min="1" value="687"></div><button class="btn" id="makeQuote">模拟生成续租报价</button></div></div><div class="toast" id="toast"></div><div class="renew-pay-mask" id="renewPaySheet"><div class="renew-pay-sheet" role="dialog" aria-modal="true" aria-labelledby="renewPayTitle"><h2 id="renewPayTitle">确认续租支付</h2><div class="row"><span>当前仓位</span><b id="renewPayUnit"></b></div><div class="row"><span>新增租期</span><b id="renewPayMonths"></b></div><div class="row"><span>本次续租报价</span><b class="total" id="renewPayTotal"></b></div><div class="notice">请核对报价与租期；确认支付后，续租将记入当前订单。</div><div class="actions"><button class="btn primary" id="renewPayConfirm">确认并支付</button><button class="btn" id="renewPayCancel">返回报价</button></div></div></div></div><script src="mini_storage_business_ssot_v274.js"></script>
<script src="../data/mini_koala_data.js"></script><script>const p=new URLSearchParams(location.search),REPO=window.MINI_STORAGE_REPO_V242,LIFE=window.MINI_STORAGE_LIFECYCLE_V242,MASTER=window.MINI_STORAGE_MASTER_V242;const orderNo=p.get('orderNo')||REPO.getCurrent().order_no||'';let order=REPO.findOrder(orderNo)||REPO.getCurrent();function $(s){return document.querySelector(s)}function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',1600)}$('#back').onclick=()=>history.length>1?history.back():location.href='mini_storage_mine_m01_v1_11_self_service_Visual_V2_7_4.html';
const store=MASTER.stores[order.store_id]||{};let req=REPO.findRenewal(orderNo);let selected=Number(req?.months||6);const QUICK_TERMS=[1,3,6,12,24,36,60];function clampTerm(v){return Math.max(1,Math.min(60,Math.round(Number(v)||1)))}function humanTerm(m){m=clampTerm(m);if(m<12)return `${m}个月`;const y=Math.floor(m/12),mo=m%12;return mo?`${m}个月（${y}年${mo}个月）`:`${y}年`}function fmt(d){return d?String(d).replace(/-/g,'/'): '—'}function discountLabel(){return ''}function render(){order=REPO.findOrder(orderNo)||order;const lc=LIFE.derive(order);$('#orderTitle').textContent=`${store.name||'门店'} · 仓位 ${order.actual_unit_id||order.unit_id||'—'}`;$('#orderMeta').textContent=`当前租期至 ${fmt(lc.end_date)} · ${Number(order.volume||0).toFixed(1)}m³`;$('#months').value=selected;document.querySelectorAll('#monthChips .chip').forEach(x=>x.classList.toggle('active',Number(x.dataset.m)===selected));$('#termCustom').classList.toggle('custom-active',!QUICK_TERMS.includes(selected));$('#termHuman').textContent=humanTerm(selected);req=REPO.findRenewal(orderNo);let html='尚未提交续租需求。';if(req){if(req.status==='QUOTE_PENDING')html=`<b>报价待确认</b><br>已申请续租 ${req.months} 个月 · 提交后未扣款。`;if(req.status==='QUOTE_READY')html=`<b>续租报价已生成</b><br>${req.months}个月 · <span class="total">¥${Number(req.quote_total||0).toLocaleString()}</span><br>月租 ¥${Number(req.quote_monthly||0).toLocaleString()} <span style="color:#8B7769;font-size:11px">· 报价以确认结果为准</span>。<div class="actions" style="margin-top:10px"><button class="btn primary" id="confirmRenew">查看并确认支付 ¥${Number(req.quote_total||0).toLocaleString()}</button></div>`;if(req.status==='COMPLETED')html=`<b>续租已支付并完成</b><br>新增 ${req.months}个月 · 新结束日期 ${fmt(req.new_end_date)} · 本次支付 ¥${Number(req.quote_total||0).toLocaleString()}`;}const history=REPO.getRenewals().filter(x=>x.order_no===orderNo&&x.status==='COMPLETED');if(history.length)html+=`<div style="margin-top:12px"><b>已完成续租记录</b>${history.map(x=>`<div>${Number(x.months)}个月 · 至 ${fmt(x.new_end_date)} · 支付 ¥${Number(x.quote_total||0).toLocaleString()}</div>`).join('')}</div>`;$('#statusBody').innerHTML=html;$('#renewForm').style.display=req&&['QUOTE_PENDING','QUOTE_READY'].includes(req.status)?'none':'block';if($('#confirmRenew'))$('#confirmRenew').onclick=openRenewPayment;$('#reviewBox').style.display=p.get('review')==='1'&&req?.status==='QUOTE_PENDING'?'block':'none';}
document.querySelectorAll('#monthChips .chip').forEach(x=>x.onclick=()=>{selected=Number(x.dataset.m);render()});$('#termMinus').onclick=()=>{selected=clampTerm(selected-1);render()};$('#termPlus').onclick=()=>{selected=clampTerm(selected+1);render()};$('#months').oninput=e=>{const raw=e.target.value.trim(),n=Number(raw);if(raw&&Number.isInteger(n)&&n>=1&&n<=60){selected=n;document.querySelectorAll('#monthChips .chip').forEach(x=>x.classList.toggle('active',Number(x.dataset.m)===selected));$('#termCustom').classList.toggle('custom-active',!QUICK_TERMS.includes(selected));$('#termHuman').textContent=humanTerm(selected)}};$('#months').onchange=e=>{selected=clampTerm(e.target.value);render()};$('#months').onkeydown=e=>{if(e.key==='Enter')e.currentTarget.blur()};$('#submitRenew').onclick=()=>{const lc=LIFE.derive(order);if(!['active','ending'].includes(lc.state)){toast('当前状态暂不能提交续租需求');return}selected=clampTerm($('#months').value||selected);REPO.saveRenewal({renewal_id:undefined,order_no:orderNo,months:selected,status:'QUOTE_PENDING',price_status:'PENDING_QUOTE',submitted_at:new Date().toISOString()});toast('续租需求已提交');render()};$('#makeQuote').onclick=()=>{req=REPO.findRenewal(orderNo);if(!req||req.status!=='QUOTE_PENDING')return;const monthly=Math.max(1,Math.round(Number($('#reviewMonthly').value||0)));REPO.saveRenewal({...req,status:'QUOTE_READY',price_status:'CONFIRMED_FOR_DEMO',quote_monthly:monthly,quote_total:monthly*Number(req.months),quoted_at:new Date().toISOString()});toast('演示报价已生成');render()};let paymentSnapshot=null;function openRenewPayment(){req=REPO.findRenewal(orderNo);if(!req||req.status!=='QUOTE_READY')return;paymentSnapshot={months:Number(req.months),total:Number(req.quote_total)};$('#renewPayUnit').textContent=`${store.name||'门店'} · 仓位 ${order.actual_unit_id||order.unit_id||'—'}`;$('#renewPayMonths').textContent=`${req.months}个月`;$('#renewPayTotal').textContent=`¥${paymentSnapshot.total.toLocaleString()}`;$('#renewPayConfirm').textContent=`确认并支付 ¥${paymentSnapshot.total.toLocaleString()}`;$('#renewPaySheet').classList.add('show')}$('#renewPayCancel').onclick=()=>{$('#renewPaySheet').classList.remove('show');paymentSnapshot=null};$('#renewPaySheet').onclick=e=>{if(e.target.id==='renewPaySheet')$('#renewPayCancel').click()};$('#renewPayConfirm').onclick=completeRenewPayment;function completeRenewPayment(){req=REPO.findRenewal(orderNo);if(!paymentSnapshot||!req||req.status!=='QUOTE_READY'||Number(req.months)!==paymentSnapshot.months||Number(req.quote_total)!==paymentSnapshot.total){$('#renewPayCancel').click();toast('报价有变化，请重新核对');render();return}$('#renewPaySheet').classList.remove('show');paymentSnapshot=null;const lc=LIFE.derive(order);let end=lc.end||new Date();let newEnd=LIFE.addMonthsClamped(new Date(end.getFullYear(),end.getMonth(),end.getDate()+1),Number(req.months));newEnd.setDate(newEnd.getDate()-1);const endISO=LIFE.toISODate(newEnd);const pay=REPO.addPayment({order_no:orderNo,type:'RENEWAL',amount:Number(req.quote_total),breakdown:{renewal_months:Number(req.months)},paid_at:new Date().toISOString()});order=REPO.updateOrder(orderNo,{end_date:endISO,lifecycle_state:'active',detail_state:'active',renewal_months_total:Number(order.renewal_months_total||0)+Number(req.months),last_renewal_monthly:Number(req.quote_monthly||0),last_renewal_total:Number(req.quote_total||0),last_renewal_payment_id:pay.payment_id});REPO.saveRenewal({...req,status:'COMPLETED',completed_at:new Date().toISOString(),new_end_date:endISO,payment_id:pay.payment_id});toast('续租已完成');render()}render();</script><script src="mini_storage_global_support_v274.js"></script>
