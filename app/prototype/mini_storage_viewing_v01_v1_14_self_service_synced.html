</head><body class="koala-uxd2-layout koala-site-shell koala-vis06c-life koala-life-service" data-ux-patch-d2="v1"><main class="app">
<header class="head"><button class="back" id="back" aria-label="返回">‹</button><h1 id="pageTitle">预约看仓</h1><div class="capsule" aria-label="微信小程序系统操作区占位"><span>•••</span><i></i><span>○</span></div></header>
<section class="intro"><div class="eyebrow">看仓预约</div><h2>选择计划到店的时间</h2><p>门店和计划查看的仓位会随预约保存；预约后仍可继续在线比较仓位。</p></section>
<section class="card"><h3>本次看仓</h3><div class="summary"><div class="row"><span>门店</span><b id="storeName">—</b></div><div class="row"><span>查看范围</span><b id="scopeText">—</b></div><div class="row" id="unitRow"><span>计划仓位</span><b id="unitText">—</b></div><div class="row" id="needRow"><span>空间需求</span><b id="needText">—</b></div></div></section>
<section class="card"><h3>到店安排</h3><div class="field"><label for="appointment">计划到店时间（09:00–18:00）</label><input id="appointment" type="datetime-local"></div><div class="field"><label for="note">给门店的备注（选填）</label><textarea id="note" maxlength="120" placeholder="例如：希望现场比较相邻大小，或需要确认电梯和停车"></textarea></div><div class="note"><b>预约看仓不锁定当前仓位</b><br/>库存可能发生变化；如果已经确定这个仓位，可以返回仓位方案直接确认。</div></section>
</main><div class="bottom"><button class="primary" id="confirm">确认预约</button></div><div class="toast" id="toast"></div>
<script src="mini_storage_business_ssot_v274.js"></script>
<script src="../data/mini_koala_data.js"></script><script>
const p=new URLSearchParams(location.search),KEY='mini_storage_viewing_current',MASTER=window.MINI_STORAGE_MASTER_V222;
const source=p.get('source')||'S02',scope=p.get('scope')||'STORE',storeId=MASTER.stores[p.get('store')]?p.get('store'):'jianguo',unitId=p.get('unit')||'',sizeOptionId=p.get('sizeOption')||'',representativeUnitNo=p.get('representativeUnit')||unitId,actualUnitId=p.get('actualUnit')||'',inventoryIdentity=actualUnitId?'ACTUAL_UNIT':(sizeOptionId?'SIZE_OPTION':(p.get('inventoryIdentity')||'STORE_ONLY'));
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const editing=p.get('edit')==='1'||Boolean(p.get('viewingId'));
const target=Number(p.get('target')||saved.target_volume||0),volume=Number(p.get('volume')||saved.volume||0),term=Number(p.get('term')||saved.term_months||0),monthly=Number(p.get('monthly')||saved.current_monthly_price||0);
function pad(n){return String(n).padStart(2,'0')}function localValue(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',1600)}
const now=new Date(),min=new Date(now),suggested=new Date(now);suggested.setDate(suggested.getDate()+1);suggested.setHours(14,0,0,0);
const appointment=document.querySelector('#appointment');appointment.min=localValue(min);appointment.value=saved.appointment_at&&editing?localValue(new Date(saved.appointment_at)):localValue(suggested);
document.querySelector('#pageTitle').textContent=editing?'修改看仓预约':'预约看仓';document.querySelector('#confirm').textContent=editing?'保存修改':'确认预约';
document.querySelector('#storeName').textContent=MASTER.stores[storeId].name;document.querySelector('#scopeText').textContent=scope==='SIZE_OPTION'?'查看容量方案':scope==='UNIT'?'查看具体仓位':'到店比较仓位';
document.querySelector('#unitRow').style.display=(sizeOptionId||unitId)?'flex':'none';document.querySelector('#unitRow span').textContent=sizeOptionId?'容量方案':'计划仓位';document.querySelector('#unitText').textContent=sizeOptionId?`${Number(volume||target||0).toFixed(1)}m³ · 仓号 ${representativeUnitNo||'—'}`:(unitId?`仓位 ${unitId}`:'—');
document.querySelector('#needRow').style.display=target?'flex':'none';document.querySelector('#needText').textContent=target?`${target.toFixed(1)}m³${term?` · ${term}个月`:''}`:'—';document.querySelector('#note').value=editing?(saved.note||''):'';
document.querySelector('#back').onclick=()=>window.MINI_KOALA_NAV.safeBack('mini_storage_home_H01_Visual_V2_7_4_SSOT.html');
document.querySelector('#confirm').onclick=()=>{const at=appointment.value;if(!at){toast('请选择计划到店时间');return}const d=new Date(at);if(Number.isNaN(d.getTime())||d<new Date()){toast('请选择晚于当前时间的到店安排');return}if(d.getHours()<9||d.getHours()>=18){appointment.focus();toast('请选择09:00–18:00的看仓时间');return}const id=editing&&saved.viewing_id?saved.viewing_id:`V${Date.now().toString().slice(-9)}`;const date=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,slot=`${pad(d.getHours())}:${pad(d.getMinutes())}`;const record={viewing_id:id,status:'BOOKED',viewing_scope:scope,source_page:source,store_id:storeId,unit_id:representativeUnitNo||unitId||null,unit_id_semantics:sizeOptionId?'LEGACY_REPRESENTATIVE_DISPLAY':(actualUnitId?'ACTUAL_UNIT':'LEGACY'),size_option_id:sizeOptionId||null,representative_unit_no:representativeUnitNo||null,actual_unit_id:actualUnitId||null,unit_identity_type:inventoryIdentity,target_volume:target||null,volume:volume||null,term_months:term||null,current_monthly_price:monthly||null,appointment_at:d.toISOString(),appointment_date:date,appointment_slot:slot,note:document.querySelector('#note').value.trim(),updated_at:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(record));const q=new URLSearchParams({viewingId:id,source,scope,store:storeId,date,slot,status:'BOOKED'});if(representativeUnitNo||unitId)q.set('unit',representativeUnitNo||unitId);if(sizeOptionId)q.set('sizeOption',sizeOptionId);if(representativeUnitNo)q.set('representativeUnit',representativeUnitNo);if(actualUnitId)q.set('actualUnit',actualUnitId);if(inventoryIdentity)q.set('inventoryIdentity',inventoryIdentity);if(target)q.set('target',String(target));if(volume)q.set('volume',String(volume));if(term)q.set('term',String(term));if(monthly)q.set('monthly',String(monthly));location.href='mini_storage_viewing_v02_v1_14_self_service_synced.html?'+q.toString()};
</script><script src="mini_storage_global_support_v274.js"></script>
