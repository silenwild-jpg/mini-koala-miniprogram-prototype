<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内部演示 · 状态注入控制台 V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#F7F3ED;color:#282F2B;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:720px;margin:auto;padding:26px 16px 48px}.card{background:#FFFDFC;border:1px solid #E6DED4;border-radius:20px;padding:18px}.tag{display:inline-block;background:#EEF5F0;color:#2F6B4F;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900}h1{font-size:24px;margin:8px 0 6px}p{font-size:12px;color:#6F7671;line-height:1.65}.group{margin-top:20px}.group h2{font-size:15px;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.entry{border:1px solid #E3DDD4;background:#fff;border-radius:13px;padding:11px;text-align:left;cursor:pointer}.entry b{display:block;font-size:12px;color:#2F6B4F}.entry span{display:block;font-size:10px;color:#707A74;line-height:1.45;margin-top:4px}.hint{margin-top:17px;background:#F4F1EB;border-radius:12px;padding:11px 12px;font-size:10px;color:#6F7671;line-height:1.6}.footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.footer a{color:#2F6B4F;text-decoration:none;font-size:11px;font-weight:900;border:1px solid #D6E0D9;background:#fff;padding:8px 10px;border-radius:10px}@media(max-width:520px){.grid{grid-template-columns:1fr}} .mini-global-support{display:none!important}</style><link rel="stylesheet" href="mk-uxc-scrollbar-hide.css" data-ui-system="ux-patch-c"/>
</head><body><div class="wrap"><div class="card"><div class="tag">内部演示 · Fixture V2</div><h1>状态注入控制台</h1><p>用于产品 / 开发 / QA 快速清理当前 localStorage 并注入指定演示状态。主演示统一使用惠新西街店 BJ0112S01A009 和同一价格快照。</p>
<div class="group"><h2>获客与成交前</h2><div class="grid"><button class="entry" data-home="new"><b>NEW 新用户首页</b><span>清空业务资产，从双任务入口开始。</span></button><button class="entry" data-home="estimated"><b>ESTIMATED 已估算</b><span>约4.8m³ · 6个月。</span></button><button class="entry" data-home="appointed"><b>APPOINTED 已预约</b><span>已预约看具体仓位。</span></button><button class="entry" data-home="pending_payment"><b>PENDING PAYMENT 待支付</b><span>订单已创建，尚未支付。</span></button></div></div>
<div class="group"><h2>支付后与生命周期</h2><div class="grid"><button class="entry" data-home="pending_use"><b>PENDING USE 待使用</b><span>已支付，起租日在未来。</span></button><button class="entry" data-home="active"><b>ACTIVE 用仓中</b><span>当前仓位与存取服务。</span></button><button class="entry" data-home="ending"><b>ENDING 即将到期</b><span>续租 / 退租优先。</span></button><button class="entry" data-home="exiting"><b>EXITING 退租处理中</b><span>验仓与押金状态。</span></button></div></div>
<div class="group"><h2>我的页面</h2><div class="grid"><button class="entry" data-mine="new"><b>M01 新用户</b><span>无业务资产。</span></button><button class="entry" data-mine="estimated"><b>M01 已估算</b><span>保留最近需求。</span></button><button class="entry" data-mine="appointed"><b>M01 已预约</b><span>待到店预约。</span></button><button class="entry" data-mine="pending_payment"><b>M01 待支付</b><span>未完成订单。</span></button><button class="entry" data-mine="pending_use"><b>M01 待使用</b><span>已支付未起租。</span></button><button class="entry" data-mine="active"><b>M01 用仓中</b><span>当前租赁资产。</span></button><button class="entry" data-mine="ending"><b>M01 即将到期</b><span>续退租入口。</span></button><button class="entry" data-mine="historical"><b>M01 历史用户</b><span>已结束订单。</span></button></div></div>
<div class="hint">切换状态会清理需求、预约、报价、订单、付款、续租、退租、发票、价格快照等演示数据，避免不同状态相互污染。此控制台只服务演示，不定义正式生产状态机。</div><div class="footer"><a href="product_demo_hub_v1.html">返回 Product Demo Hub</a><a href="index_state_machine_demo.html">打开 State Matrix V2</a></div></div></div>
<script src="mini_storage_demo_fixture_v2.js"></script><script>
const D=window.MINI_KOALA_DEMO_V2;document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>D.home(b.dataset.home));document.querySelectorAll('[data-mine]').forEach(b=>b.onclick=()=>D.mine(b.dataset.mine));
const p=new URLSearchParams(location.search),auto=p.get('auto'),target=p.get('target');if(auto){const map={new:'new',estimated:'estimated',viewing:'appointed',appointed:'appointed',quoted:'quoted',pending:'pending_payment',pending_payment:'pending_payment',pending_use:'pending_use',active:'active',ending:'ending',returning:'exiting',exiting:'exiting',ended:'historical',historical:'historical'};const s=map[auto];if(s)setTimeout(()=>target==='mine'?D.mine(s):target==='order'?D.orderDetail(s):D.home(s),40);}
</script><script src="mini_storage_global_support_v274.js"></script></body></html>
