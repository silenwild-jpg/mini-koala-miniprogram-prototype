<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>迷你考拉仓｜02G 中央同源演示候选</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f8f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.central-host{width:100%;height:100dvh;border:0;display:block;background:#fff}.error{display:none;box-sizing:border-box;max-width:500px;margin:60px auto;padding:18px;color:#28443a;line-height:1.7}.error h1{font-size:20px}.error p{font-size:14px}.error a{color:#006d52}</style>
<script src="prototype/parallel/core-journey-fix-01/demo/fixtures.js"></script><script src="prototype/parallel/core-journey-fix-01/demo/central-contract.js"></script></head>
<body><iframe class="central-host" id="central-host" title="迷你考拉仓统一业务演示候选"></iframe>
<section class="error" role="alert" id="central-error"><h1>未能打开此演示入口</h1><p id="central-reason"></p><p>此候选使用独立的演示门店仓位目录；旧中央 MK_* ID 与演示 SIM_* ID 不自动对应，避免报价或订单串仓。</p><a href="central-review-02g.html">返回统一演示首页</a></section>
<script>
(function(){
'use strict';
const f=SIM_FIXTURES,c=SIM_CENTRAL_CONTRACT_V1,p=new URLSearchParams(location.search);
try{
 const page=(p.get('page')||'H01').toUpperCase(),store=p.get('store'),unit=p.get('unit');
 let stored=null;try{stored=JSON.parse(sessionStorage.getItem('mk_independent_sim_v1')||'null');}catch{}
 // A user must arrive at O01 from the in-app purchase action, not forge a page query.
 const qualified=Boolean(stored&&stored.selected?.length&&stored.auth?.status==='verified'&&stored.quote);
 const url=c.route(f,{page,store,unit,hasEligibleOrderContext:qualified});
 document.getElementById('central-host').src='prototype/parallel/core-journey-fix-01/demo/'+url;
 document.body.dataset.contract=c.VERSION;
 document.body.dataset.source=f.version;
}catch(e){
 const frame=document.getElementById('central-host');frame.remove();
 document.getElementById('central-error').style.display='block';
 document.getElementById('central-reason').textContent='来源契约拒绝了此链接：'+String(e.message||e);
}
})();
</script></body></html>
