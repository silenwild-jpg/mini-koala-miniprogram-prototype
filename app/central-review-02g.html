<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>迷你考拉仓｜02G 中央同源演示候选</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f8f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.central-host{width:100%;height:100dvh;border:0;display:block;background:#fff}.error{display:none;box-sizing:border-box;max-width:500px;width:100%;margin:60px auto;padding:18px;overflow-wrap:anywhere;color:#28443a;line-height:1.7}.error h1{font-size:20px}.error p{font-size:14px}.error a{color:#006d52}.legacy-notice{box-sizing:border-box;display:none;height:36px;align-items:center;justify-content:center;font-size:12px;color:#176448;background:#edf8f3;padding:0 12px;text-align:center}body.legacy-entry .legacy-notice{display:flex}body.legacy-entry .central-host{height:calc(100dvh - 36px)}</style>
<script>
(function(){
  const mode=new URLSearchParams(location.search).get('catalog')==='mk'?'MK':'SIM';
  sessionStorage.setItem('mk_active_catalog_v1',mode);
})();
</script><script src="prototype/parallel/core-journey-fix-01/demo/fixtures.js"></script><script src="prototype/parallel/core-journey-fix-01/demo/central-contract.js"></script></head>
<body><div class="legacy-notice" role="status">独立仓位详情已取消，请从门店选择仓位。</div><iframe class="central-host" id="central-host" title="迷你考拉仓统一业务演示候选"></iframe>
<section class="error" role="alert" id="central-error"><h1 id="central-error-title">暂时无法打开此页面</h1><p id="central-reason">页面信息可能已更新，请返回首页重新选择。</p><a href="central-review-02g.html?catalog=sim&page=H01">返回首页</a></section>
<script>
(function(){
'use strict';
const f=SIM_FIXTURES,c=SIM_CENTRAL_CONTRACT_V1,p=new URLSearchParams(location.search);
try{
 // Never trust stale unit IDs or quote parameters from a retired U01 deep link.
 if((p.get('page')||'').toUpperCase()==='U01'){
  const safe=new URL(location.href);safe.search='';
  safe.searchParams.set('catalog',p.get('catalog')==='mk'?'mk':'sim');
  safe.searchParams.set('page','S01');
  safe.searchParams.set('s01_r2','1');
  safe.searchParams.set('legacy','u01');
  location.replace(safe.href);
  return;
 }
 if(p.get('legacy')==='u01')document.body.classList.add('legacy-entry');
 if(p.get('s01_r2')==='1'){document.title='迷你考拉仓';document.getElementById('central-host').title='迷你考拉仓';}
 const page=(p.get('page')||'H01').toUpperCase(),store=p.get('store'),unit=p.get('unit');
 let stored=null;try{stored=JSON.parse(sessionStorage.getItem('mk_independent_sim_v1')||'null');}catch{}
 // A user must arrive at O01 from the in-app purchase action, not forge a page query.
 const qualified=Boolean(stored&&stored.selected?.length&&stored.auth?.status==='verified'&&stored.quote);
 let url=c.route(f,{page,store,unit,hasEligibleOrderContext:qualified});
 // RESTORE-06: S01 is the unique high-fidelity customer entry; old ?s01_r2=0 cannot reopen the retired list.
 if(page==='S01')url+=(url.includes('?')?'&':'?')+'s01_r2=1';
 document.getElementById('central-host').src='prototype/parallel/core-journey-fix-01/demo/'+url;
 document.body.dataset.contract=c.VERSION;
 document.body.dataset.source=f.version;
 document.body.dataset.catalog=f.sourceNamespace||'SIM';
}catch(e){
 const frame=document.getElementById('central-host');frame.remove();
 document.getElementById('central-error').style.display='block';
 const isColdOrder=(p.get('page')||'').toUpperCase()==='O01';
 document.getElementById('central-error-title').textContent=isColdOrder?'请先选择仓位':'暂时无法打开此页面';
 document.getElementById('central-reason').textContent=isColdOrder?'请先从附近门店选择仓位，并完成必要的验证后继续下单。':'页面信息可能已更新，请返回首页重新选择。';
}
})();
</script></body></html>
